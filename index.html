/* ==========================================================================
   Writerstm Stream TV - 10-Foot UI & Legacy TV Screen Compatible CSS
   Compatible with: WebKit 534+, Opera Presto TV, Tizen 2+, webOS 1+, Android 4+
   Zero CSS Houdini, Zero CSS Grid requirements, Full standard CSS fallbacks
   ========================================================================== */

/* Reset & Box Sizing */
* {
  -webkit-box-sizing: border-box;
  -moz-box-sizing: border-box;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background-color: #0d0d11;
  color: #f0f0f5;
  font-family: Arial, Helvetica, "Trebuchet MS", "DejaVu Sans", sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* TV Focus Highlights - High Contrast Golden / Zero-Lag Outline */
a, button, input, select, .tv-card, .tv-btn, .tv-tab, .tv-chip {
  outline: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

:focus,
.tv-focused {
  outline: 3px solid #ffcc00 !important;
  outline-offset: 1px !important;
  border-color: #ffcc00 !important;
  background-color: #2b2b3d !important;
  color: #ffffff !important;
  z-index: 10 !important;
}

/* App Header & Top Navigation */
#tv-header {
  width: 100%;
  background-color: #14141c;
  border-bottom: 2px solid #232330;
  padding: 12px 24px;
  position: relative;
  z-index: 40;
}

.tv-header-inner {
  max-width: 1600px;
  margin: 0 auto;
}

.tv-brand {
  display: inline-block;
  vertical-align: middle;
  margin-right: 25px;
}

.tv-logo-badge {
  display: inline-block;
  background-color: #e50914;
  color: #ffffff;
  font-weight: bold;
  font-size: 14px;
  padding: 4px 8px;
  border-radius: 4px;
  margin-right: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.tv-brand-title {
  font-size: 22px;
  font-weight: bold;
  color: #ffffff;
  vertical-align: middle;
  letter-spacing: -0.5px;
}

.tv-brand-subtitle {
  font-size: 11px;
  color: #e50914;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  display: block;
}

/* Nav Tabs */
.tv-nav-tabs {
  display: inline-block;
  vertical-align: middle;
}

.tv-tab {
  display: inline-block;
  padding: 8px 18px;
  margin-right: 6px;
  background-color: #1c1c28;
  color: #a0a0b2;
  border: 2px solid #29293a;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  text-decoration: none;
}

.tv-tab:hover {
  background-color: #2a2a3d;
  color: #ffffff;
}

.tv-tab.active {
  background-color: #e50914;
  color: #ffffff;
  border-color: #ff3b47;
}

/* Search Bar in Header */
.tv-search-box {
  display: inline-block;
  vertical-align: middle;
  float: right;
  margin-top: 2px;
}

.tv-search-input {
  background-color: #1b1b24;
  color: #ffffff;
  border: 2px solid #323246;
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 14px;
  width: 250px;
  outline: none;
}

.tv-search-input:focus {
  border-color: #ffcc00;
}

.tv-btn-clear {
  background-color: #333346;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 12px;
  margin-left: 6px;
}

/* Filter Sub-bar */
#tv-filter-bar {
  background-color: #101017;
  border-bottom: 1px solid #1e1e2c;
  padding: 10px 24px;
  white-space: nowrap;
  overflow-x: auto;
}

.tv-filter-inner {
  max-width: 1600px;
  margin: 0 auto;
}

.tv-section-label {
  display: inline-block;
  color: #88889c;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-right: 12px;
  vertical-align: middle;
}

.tv-chip {
  display: inline-block;
  padding: 6px 14px;
  margin-right: 8px;
  background-color: #1a1a24;
  color: #a5a5bb;
  border: 1px solid #282836;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  vertical-align: middle;
}

.tv-chip:hover {
  background-color: #262638;
  color: #ffffff;
}

.tv-chip.active {
  background-color: #e50914;
  color: #ffffff;
  border-color: #e50914;
}

.tv-chip.genre-active {
  background-color: #ffcc00;
  color: #000000;
  border-color: #ffcc00;
  font-weight: bold;
}

/* Genre Dropdown for Old TVs */
.tv-genre-select {
  display: inline-block;
  vertical-align: middle;
  background-color: #1a1a26;
  color: #ffffff;
  border: 2px solid #33334d;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 6px;
  margin-left: 10px;
}

/* Main Container */
#tv-main {
  max-width: 1600px;
  margin: 0 auto;
  padding: 20px 24px 80px 24px;
}

/* TV Hero / Featured Spotlight Banner (Ultra-Lightweight Solid Card, 0 Texture Memory) */
#tv-spotlight {
  width: 100%;
  background-color: #151520;
  border: 2px solid #282838;
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.tv-spotlight-flex {
  width: 100%;
}

.tv-spotlight-content {
  display: inline-block;
  vertical-align: middle;
  width: 82%;
  max-width: 900px;
}

.tv-spotlight-thumb-wrap {
  display: inline-block;
  vertical-align: middle;
  width: 16%;
  text-align: right;
  float: right;
}

.tv-spotlight-thumb {
  max-height: 120px;
  border-radius: 6px;
  border: 1px solid #333346;
  display: inline-block;
}

.tv-spotlight-badge {
  display: inline-block;
  background-color: #e50914;
  color: #ffffff;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.tv-spotlight-rating {
  display: inline-block;
  background-color: #000000;
  color: #ffd700;
  font-size: 12px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 4px;
  margin-left: 8px;
  border: 1px solid #333333;
}

.tv-spotlight-title {
  font-size: 24px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.2;
  margin-bottom: 8px;
}

.tv-spotlight-desc {
  font-size: 13px;
  color: #b0b0c2;
  line-height: 1.4;
  margin-bottom: 14px;
  max-height: 38px;
  overflow: hidden;
}

.tv-btn {
  display: inline-block;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 8px;
  border: 2px solid transparent;
  text-decoration: none;
  margin-right: 12px;
  vertical-align: middle;
  text-align: center;
}

.tv-btn-primary {
  background-color: #e50914;
  color: #ffffff;
}

.tv-btn-primary:hover {
  background-color: #ff1f2d;
}

.tv-btn-secondary {
  background-color: #232332;
  color: #e0e0e0;
  border-color: #38384e;
}

.tv-btn-secondary:hover {
  background-color: #333348;
  color: #ffffff;
}

/* Grid & Cards (Compatible with all old TV layout engines) */
.tv-grid {
  width: 100%;
  margin-top: 15px;
}

.tv-card {
  display: inline-block;
  vertical-align: top;
  width: 15.6%;
  margin: 0 0.5% 20px 0.5%;
  background-color: #171722;
  border: 2px solid #252535;
  border-radius: 10px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}

/* Responsive grid for lower-res 720p/480p TVs */
@media screen and (max-width: 1200px) {
  .tv-card { width: 19%; }
}
@media screen and (max-width: 900px) {
  .tv-card { width: 24%; }
}
@media screen and (max-width: 650px) {
  .tv-card { width: 32%; }
}
@media screen and (max-width: 480px) {
  .tv-card { width: 48%; }
}

.tv-poster-wrap {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 148%;
  background-color: #1c1c28;
  overflow: hidden;
}

.tv-poster-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: none;
}

.tv-card-badge-type {
  position: absolute;
  bottom: 8px;
  left: 8px;
  background-color: rgba(0, 0, 0, 0.85);
  color: #ffffff;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #333344;
  text-transform: uppercase;
}

.tv-card-badge-rating {
  position: absolute;
  top: 8px;
  right: 8px;
  background-color: rgba(0, 0, 0, 0.85);
  color: #ffd700;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #333344;
}

.tv-card-info {
  padding: 10px;
}

.tv-card-title {
  font-size: 14px;
  font-weight: bold;
  color: #f5f5f5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tv-card-meta {
  font-size: 12px;
  color: #8c8ca0;
  margin-top: 4px;
}

/* Section Title */
.tv-section-header {
  margin: 20px 0 12px 0;
  padding: 0 4px;
}

.tv-section-title {
  font-size: 24px;
  font-weight: 800;
  color: #ffffff;
  display: inline-block;
  letter-spacing: -0.3px;
}

.tv-section-desc {
  font-size: 13px;
  color: #8a8aa2;
  margin-left: 12px;
  display: inline-block;
}

/* Quick Search Suggestions Bar for TV Remote Users */
.tv-quick-search-bar {
  margin-top: 10px;
  padding: 6px 0;
  overflow-x: auto;
  white-space: nowrap;
}

.tv-quick-search-label {
  display: inline-block;
  color: #7b7b92;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  margin-right: 8px;
}

.tv-quick-tag {
  display: inline-block;
  background-color: #191924;
  color: #a0a0b8;
  border: 1px solid #28283a;
  border-radius: 12px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  margin-right: 6px;
  text-decoration: none;
}

.tv-quick-tag:hover {
  background-color: #262638;
  color: #ffffff;
}

/* Pagination Bar */
.tv-pagination {
  text-align: center;
  margin: 30px 0;
  padding: 15px;
}

.tv-page-indicator {
  display: inline-block;
  font-size: 15px;
  font-weight: bold;
  color: #a0a0b4;
  margin: 0 15px;
  vertical-align: middle;
}

/* Bottom Remote Control Key Guide Bar */
#tv-remote-guide {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: #0b0b10;
  border-top: 2px solid #222230;
  padding: 8px 16px;
  z-index: 100;
  font-size: 12px;
  color: #8e8ea6;
  text-align: center;
}

.tv-key-hint {
  display: inline-block;
  margin: 0 10px;
}

.tv-key-badge {
  display: inline-block;
  background-color: #232332;
  color: #ffcc00;
  border: 1px solid #44445a;
  border-radius: 4px;
  padding: 1px 6px;
  font-weight: bold;
  font-family: monospace;
  margin-right: 4px;
}

/* Modals: Player & Details Screen */
.tv-modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.95);
  z-index: 1000;
  overflow-y: auto;
  display: none;
}

.tv-modal-backdrop.open {
  display: block;
}

/* Details Modal Panel */
#tv-info-modal .tv-modal-panel {
  max-width: 1200px;
  margin: 20px auto;
  background-color: #14141d;
  border: 3px solid #2d2d3e;
  border-radius: 12px;
  overflow: hidden;
}

/* Player Modal - 100% Fullscreen on TVs and APKs */
#tv-player-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  padding: 0;
  margin: 0;
  background-color: #000000;
  z-index: 99999;
  overflow: hidden;
}

#tv-player-modal .tv-modal-panel {
  width: 100%;
  height: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 0;
  background-color: #000000;
  position: relative;
  display: -webkit-box;
  display: -webkit-flex;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  -ms-flex-direction: column;

}

.tv-modal-header {

.tv-modal-title-group {

.tv-modal-title {

.tv-ep-quick-nav {

}

.tv-hdr-ep-badge {

.tv-modal-actions {

.tv-modal-close-btn {

}

/* Video Stage - Dynamically fills entire TV / APK screen */
.tv-player-stage {
  width: 100%;

  -webkit-flex: 1 1 auto;
  -ms-flex: 1 1 auto;
  flex: 1 1 auto;

        homeUrl = "https://api.themoviedb.org/3/trending/all/" + timeWindow + "?api_key=" + TMDB_KEY + "&page=" + page;
      }

      ajaxGet(homeUrl, function (res) {
        var rawResults = (res && res.results) ? res.results : [];
        var results = rawResults.slice(0, 12);
        state.totalPages = Math.min((res && res.total_pages) ? res.total_pages : 1, 500);
        state.items = [];
        for (var i = 0; i < results.length; i++) {
          var hItem = results[i];
          var mediaType = hItem.media_type || (hItem.first_air_date ? "tv" : "movie");
          if (hItem.original_language === "ja" && hItem.genre_ids && hItem.genre_ids.indexOf(16) !== -1) {
            mediaType = "anime";
          }
          if (hItem.poster_path || hItem.backdrop_path) {
            state.items.push({
              id: hItem.id,
              type: mediaType,
              title: hItem.title || hItem.name || "Media Title",
              poster: hItem.poster_path ? "https://image.tmdb.org/t/p/w185" + hItem.poster_path : "",
              backdrop: "",
              overview: hItem.overview || "Popular stream entertainment.",
              year: (hItem.release_date || hItem.first_air_date || "N/A").split("-")[0],
              rating: hItem.vote_average ? hItem.vote_average.toFixed(1) : "N/A"
            });
          }
        }
        state.isLoading = false;
        if (state.items.length > 0 && !state.searchQuery) {
          state.spotlightItem = state.items[0];
        }
        renderSpotlight();
        renderGrid();
        if (callback) callback();
      }, function () {
        state.isLoading = false;
        renderGrid();
      });
      return;
    }

    // Movie / TV
    var endpoint = "";
    if (query) {
      endpoint = "https://api.themoviedb.org/3/search/" + tab + "?api_key=" + TMDB_KEY +
        "&query=" + encodeURIComponent(query) + "&page=" + page;
    } else {
      var path = cat === "trending" ? "trending/" + tab + "/week" :
        (cat === "popular" ? tab + "/popular" : tab + "/top_rated");
      endpoint = "https://api.themoviedb.org/3/" + path + "?api_key=" + TMDB_KEY + "&page=" + page;
      if (genre) endpoint += "&with_genres=" + genre;
    }

    ajaxGet(endpoint, function (res) {
      var rawResults = (res && res.results) ? res.results : [];
      var results = rawResults.slice(0, 12);
      state.totalPages = Math.min((res && res.total_pages) ? res.total_pages : 1, 500);
      state.items = [];
      for (var i = 0; i < results.length; i++) {
        var item = results[i];
        if (item.poster_path || item.backdrop_path) {
          state.items.push({
            id: item.id,
            type: tab,
            title: item.title || item.name || "Untitled",
            poster: item.poster_path ? "https://image.tmdb.org/t/p/w185" + item.poster_path : "",
            backdrop: "",
            overview: item.overview || "Stream media title.",
            year: (item.release_date || item.first_air_date || "N/A").split("-")[0],
            rating: item.vote_average ? item.vote_average.toFixed(1) : "N/A"
          });
        }
      }
      state.isLoading = false;
      if (state.items.length > 0 && !state.searchQuery) {
        state.spotlightItem = state.items[0];
      }
      renderSpotlight();
      renderGrid();
      if (callback) callback();
    }, function () {
      state.isLoading = false;
      renderGrid();
    });
  }

  // --- Rendering UI with Pure DOM & Safe HTML Strings ---
  function renderTabs() {
    var tabs = [
      { id: "home", label: "Home" },
      { id: "movie", label: "Movies" },
      { id: "tv", label: "TV Shows" },
      { id: "anime", label: "Anime" },
      { id: "archive", label: "Public Domain" },
      { id: "watchlist", label: "Watchlist (" + state.watchlist.length + ")" }
    ];

    var html = "";
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i];
      var isAct = state.currentTab === t.id ? " active" : "";
      html += '<button type="button" class="tv-tab' + isAct + '" tabindex="0" data-nav="tab" data-tab="' + t.id + '">' +
        t.label + '</button>';
    }
    var container = document.getElementById("tv-nav-tabs");
    if (container) container.innerHTML = html;
  }

  function renderFilters() {
    var bar = document.getElementById("tv-filter-bar");
    if (!bar) return;
    if (state.currentTab === "watchlist") {
      bar.style.display = "none";
      return;
    }
    bar.style.display = "block";

    var categories = [
      { id: "trending", label: "Trending" },
      { id: "popular", label: "Most Popular" },
      { id: "top_rated", label: "Top Rated" }
    ];

    var html = '<div class="tv-filter-inner"><span class="tv-section-label">Sort:</span>';
    for (var i = 0; i < categories.length; i++) {
      var c = categories[i];
      var act = state.currentCategory === c.id ? " active" : "";
      html += '<button type="button" class="tv-chip' + act + '" tabindex="0" data-nav="cat" data-cat="' + c.id + '">' +
        c.label + '</button>';
    }

    var curGenres = GENRES_MAP[state.currentTab] || [];
    if (curGenres.length > 0) {
      html += '<span class="tv-section-label" style="margin-left:18px;">Genre:</span>';
      html += '<button type="button" class="tv-chip' + (state.currentGenre === "" ? " genre-active" : "") +
        '" tabindex="0" data-nav="genre" data-genre="">All</button>';
      for (var j = 0; j < Math.min(curGenres.length, 8); j++) {
        var g = curGenres[j];
        var gAct = state.currentGenre === g.id ? " genre-active" : "";
        html += '<button type="button" class="tv-chip' + gAct + '" tabindex="0" data-nav="genre" data-genre="' + g.id + '">' +
          g.name + '</button>';
      }
    }
    html += '</div>';
    bar.innerHTML = html;
  }

  function renderSpotlight() {
    var container = document.getElementById("tv-spotlight");
    if (!container) return;
    var item = state.spotlightItem;
    if (!item || state.currentTab === "watchlist" || state.searchQuery) {
      container.style.display = "none";
      return;
    }

    container.style.display = "block";
    container.style.backgroundImage = "none";

    var isBookmarked = isInWatchlist(item.id);
    var thumbHtml = item.poster ? '<div class="tv-spotlight-thumb-wrap"><img class="tv-spotlight-thumb" src="' + item.poster + '" alt="" /></div>' : '';
    var html = '<div class="tv-spotlight-flex">' +
      '<div class="tv-spotlight-content">' +
        '<span class="tv-spotlight-badge">' + (item.type || "FEATURED").toUpperCase() + '</span>' +
        (item.rating && item.rating !== "N/A" ? '<span class="tv-spotlight-rating">&#9733; ' + item.rating + '</span>' : '') +
        '<h2 class="tv-spotlight-title">' + escapeHtml(item.title) + '</h2>' +
        '<p class="tv-spotlight-desc">' + escapeHtml(item.overview || "Click Play to begin streaming on your TV screen.") + '</p>' +
        '<div>' +
          '<button type="button" class="tv-btn tv-btn-primary" tabindex="0" id="btn-spotlight-play" data-id="' + item.id + '">&#9658; PLAY NOW [OK]</button>' +
          '<button type="button" class="tv-btn tv-btn-secondary" tabindex="0" id="btn-spotlight-info" data-id="' + item.id + '">&#9432; DETAILS</button>' +
          '<button type="button" class="tv-btn tv-btn-secondary" tabindex="0" id="btn-spotlight-bookmark" data-id="' + item.id + '">' +
            (isBookmarked ? '&#10004; SAVED' : '+ WATCHLIST') +
          '</button>' +
        '</div>' +
      '</div>' +
      thumbHtml +
    '</div>';
    container.innerHTML = html;
  }

  function renderGrid() {
    var container = document.getElementById("tv-grid");
    if (!container) return;

    if (state.isLoading) {
      container.innerHTML = '<div class="tv-state-panel">' +
        '<div class="tv-spinner"></div>' +
        '<p style="font-size:18px; font-weight:bold; color:#a0a0b8;">Loading media streams for TV...</p>' +
        '</div>';
      return;
    }

    if (!state.items || state.items.length === 0) {
      var msg = state.currentTab === "watchlist" ?
        "Your Watchlist is currently empty. Bookmark movies or TV shows to watch them here anytime." :
        "No media streams found matching your request. Try another category or search.";
      container.innerHTML = '<div class="tv-state-panel">' +
        '<p style="font-size:20px; font-weight:bold; color:#ffffff; margin-bottom:8px;">No Items Found</p>' +
        '<p style="font-size:14px; color:#888899;">' + msg + '</p>' +
        '</div>';
      renderPagination();
      return;
    }

    var html = "";
    for (var i = 0; i < state.items.length; i++) {
      var item = state.items[i];
      var posterSrc = item.poster || "";
      var typeLabel = item.type === "archive" ? "ARCHIVE" : (item.type || "MEDIA").toUpperCase();
      var isSaved = isInWatchlist(item.id);

      html += '<div class="tv-card" tabindex="0" data-nav="card" data-index="' + i + '" data-id="' + item.id + '" title="' + escapeHtml(item.title) + '">' +
        '<div class="tv-poster-wrap">' +
          (posterSrc ? '<img class="tv-poster-img" src="' + posterSrc + '" alt="' + escapeHtml(item.title) + '" onerror="this.style.display=\'none\';">' : '') +
          '<span class="tv-card-badge-type">' + typeLabel + '</span>' +
          (item.rating && item.rating !== "N/A" ? '<span class="tv-card-badge-rating">&#9733; ' + item.rating + '</span>' : '') +
        '</div>' +
        '<div class="tv-card-info">' +
          '<div class="tv-card-title">' + escapeHtml(item.title) + '</div>' +
          '<div class="tv-card-meta">' +
            '<span>' + (item.year || "") + '</span>' +
            (isSaved ? '<span style="color:#e50914; float:right; font-weight:bold;">&#9733; SAVED</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    }

    container.innerHTML = html;
    renderPagination();
  }

  function renderPagination() {
    var pag = document.getElementById("tv-pagination");
    if (!pag) return;
    if (state.currentTab === "watchlist" || state.totalPages <= 1 || state.items.length === 0) {
      pag.style.display = "none";
      return;
    }
    pag.style.display = "block";
    pag.innerHTML = '<button type="button" class="tv-btn tv-btn-secondary" tabindex="0" id="btn-page-prev"' +
      (state.currentPage <= 1 ? ' disabled style="opacity:0.4;"' : '') + '>&#9664; PREVIOUS PAGE</button>' +
      '<span class="tv-page-indicator">Page ' + state.currentPage + ' of ' + state.totalPages + '</span>' +
      '<button type="button" class="tv-btn tv-btn-secondary" tabindex="0" id="btn-page-next"' +
      (state.currentPage >= state.totalPages ? ' disabled style="opacity:0.4;"' : '') + '>NEXT PAGE &#9654;</button>';
  }

  function renderContinueWatching() {
    var container = document.getElementById("tv-history-section");
    if (!container) return;
    if (!state.history || state.history.length === 0 || state.currentTab === "watchlist") {
      container.style.display = "none";
      return;
    }
    container.style.display = "block";

    var html = '<div class="tv-section-header">' +
      '<span class="tv-section-title">&#8635; Continue Watching</span>' +
      '<button type="button" class="tv-btn tv-btn-secondary" id="btn-clear-history" tabindex="0" style="padding:4px 10px; font-size:12px; float:right;">Clear History</button>' +
      '</div>' +
      '<div class="tv-grid" style="white-space:nowrap; overflow-x:auto; padding-bottom:10px;">';

    for (var i = 0; i < Math.min(state.history.length, 10); i++) {
      var h = state.history[i];
      var epText = (h.type === "tv" || h.type === "anime") ? ("S" + (h.resumeSeason || 1) + " E" + (h.resumeEpisode || 1)) : "Movie";
      html += '<div class="tv-card" style="width:160px; display:inline-block; margin-right:12px;" tabindex="0" data-nav="history-card" data-id="' + h.id + '">' +
        '<div class="tv-poster-wrap">' +
          '<img class="tv-poster-img" src="' + (h.poster || "") + '" alt="' + escapeHtml(h.title) + '">' +
          '<span class="tv-card-badge-type" style="background-color:#e50914;">' + epText + '</span>' +
        '</div>' +
        '<div class="tv-card-info">' +
          '<div class="tv-card-title">' + escapeHtml(h.title) + '</div>' +
        '</div>' +
      '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
  }

  // --- SVG Poster Fallback for Old Screens & Offline Assets ---
  function getSvgPoster(title, type, year) {
    var safeTitle = escapeHtml(title || "Cinema");
    var safeYear = year ? String(year) : "";
    var badgeColor = type === "anime" ? "#9333ea" : (type === "tv" ? "#2563eb" : (type === "archive" ? "#059669" : "#e50914"));
    var badgeLabel = type === "anime" ? "ANIME" : (type === "tv" ? "TV SHOW" : (type === "archive" ? "PUBLIC DOMAIN" : "CINEMA"));

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">' +
      '<rect width="100%" height="100%" fill="#161622" />' +
      '<circle cx="200" cy="240" r="80" fill="none" stroke="#2c2c3e" stroke-width="4" />' +
      '<polygon points="190,215 225,240 190,265" fill="' + badgeColor + '" />' +
      '<rect x="20" y="20" width="130" height="30" rx="6" fill="' + badgeColor + '" />' +
      '<text x="85" y="40" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">' + badgeLabel + '</text>' +
      (safeYear ? '<text x="350" y="40" fill="#aaaaaa" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">' + safeYear + '</text>' : '') +
      '<text x="200" y="490" fill="#ffffff" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">' +
        (safeTitle.length > 20 ? safeTitle.slice(0, 18) + "..." : safeTitle) +
      '</text>' +
      '<text x="200" y="525" fill="#888899" font-family="Arial" font-size="12" letter-spacing="2" text-anchor="middle">WRITERSTM TV</text>' +
    '</svg>';
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function isInWatchlist(id) {
    for (var i = 0; i < state.watchlist.length; i++) {
      if (String(state.watchlist[i].id) === String(id)) return true;
    }
    return false;
  }

  function toggleWatchlist(item) {
    var foundIdx = -1;
    for (var i = 0; i < state.watchlist.length; i++) {
      if (String(state.watchlist[i].id) === String(item.id)) {
        foundIdx = i;
        break;
      }
    }
    if (foundIdx !== -1) {
      state.watchlist.splice(foundIdx, 1);
      showToast("Removed from Watchlist");
    } else {
      state.watchlist.unshift(item);
      showToast("Saved to Watchlist!");
    }
    setStorage(WATCHLIST_STORAGE_KEY, state.watchlist);
    renderTabs();
    renderSpotlight();
    if (state.currentTab === "watchlist") {
      fetchMedia();
    } else {
      renderGrid();
    }
  }

  function saveHistory(item, season, episode) {
    var filtered = [];
    for (var i = 0; i < state.history.length; i++) {
      if (String(state.history[i].id) !== String(item.id)) {
        filtered.push(state.history[i]);
      }
    }
    var entry = {
      id: item.id,
      type: item.type,
      title: item.title,
      poster: item.poster,
      resumeSeason: season || item.resumeSeason || 1,
      resumeEpisode: episode || item.resumeEpisode || 1,
      time: new Date().getTime()
    };
    filtered.unshift(entry);
    state.history = filtered.slice(0, 20);
    setStorage(HISTORY_STORAGE_KEY, state.history);
    renderContinueWatching();
  }

  // --- TV Video Player & Streaming Manager ---
  function getStreamUrl(server, id, type, season, episode) {
    var isMovie = (type === "movie");
    var s = season || 1;
    var ep = episode || 1;

    switch (server) {
      case "vidlink":
        return isMovie ?
          "https://vidlink.pro/movie/" + id + "?autoplay=true&sub.lang=en&sub.default=true" :
          "https://vidlink.pro/tv/" + id + "/" + s + "/" + ep + "?autoplay=true&sub.lang=en&sub.default=true";
      case "embedsu":
        return isMovie ?
          "https://embed.su/embed/movie/" + id + "?autoplay=1" :
          "https://embed.su/embed/tv/" + id + "/" + s + "/" + ep + "?autoplay=1";
      case "vidsrc_to":
        return isMovie ?
          "https://vidsrc.to/embed/movie/" + id + "?autoplay=1" :
          "https://vidsrc.to/embed/tv/" + id + "/" + s + "/" + ep + "?autoplay=1";
      case "autoembed":
        return isMovie ?
          "https://player.autoembed.cc/embed/movie/" + id + "?autoplay=1" :
          "https://player.autoembed.cc/embed/tv/" + id + "/" + s + "/" + ep + "?autoplay=1";
      case "vidsrc_me":
        return isMovie ?
          "https://vidsrc.me/embed/movie?tmdb=" + id + "&autoplay=1" :
          "https://vidsrc.me/embed/tv?tmdb=" + id + "&season=" + s + "&episode=" + ep + "&autoplay=1";
      case "vidbinge":
        return isMovie ?
          "https://vidbinge.com/embed/movie/" + id + "?autoplay=1" :
          "https://vidbinge.com/embed/tv/" + id + "/" + s + "/" + ep + "?autoplay=1";
      case "smashy":
        return isMovie ?
          "https://player.smashy.stream/movie/" + id + "?autoplay=1" :
          "https://player.smashy.stream/tv/" + id + "?s=" + s + "&e=" + ep + "&autoplay=1";
      case "2embed":
        return isMovie ?
          "https://www.2embed.cc/embed/" + id + "?autoplay=1" :
          "https://www.2embed.cc/embedtv/" + id + "&s=" + s + "&e=" + ep + "&autoplay=1";
      case "movieapi":
        return isMovie ?
          "https://movieapi.stream/movie/" + id + "?autoplay=1" :
          "https://movieapi.stream/tv/" + id + "-" + s + "-" + ep + "?autoplay=1";
      default:
        return isMovie ?
          "https://vidlink.pro/movie/" + id + "?autoplay=true" :
          "https://vidlink.pro/tv/" + id + "/" + s + "/" + ep + "?autoplay=true";
    }
  }

  function openPlayer(item, season, episode) {
    state.currentPlaying = item;
    state.currentSeason = season || item.resumeSeason || 1;
    state.currentEpisode = episode || item.resumeEpisode || 1;
    state.episodeRangeIndex = Math.floor((state.currentEpisode - 1) / 20);
    saveHistory(item, state.currentSeason, state.currentEpisode);

    var modal = document.getElementById("tv-player-modal");
    if (!modal) return;
    modal.className = "tv-modal-backdrop open";

    // Set title & header quick navigation
    updatePlayerTitle();
    renderServerBar();

    var isTv = (item.type === "tv" || item.type === "anime");
    var quickNav = document.getElementById("tv-player-quick-nav");
    if (isTv) {
      if (quickNav) quickNav.style.display = "inline-block";
      var hdrBadge = document.getElementById("tv-hdr-ep-badge");
      if (hdrBadge) hdrBadge.innerHTML = "S" + state.currentSeason + " &bull; E" + state.currentEpisode;
    } else {
      if (quickNav) quickNav.style.display = "none";
    }

    // Check if Public domain (Archive.org)
    if (item.type === "archive") {
      setupArchivePlayer(item.id);
    } else {
      setupEmbedPlayer(item);
    }

    // If TV or Anime, load seasons & episodes
    if (isTv) {
      loadSeasons(item);
    } else {
      var epSec = document.getElementById("tv-player-episodes");
      if (epSec) epSec.style.display = "none";
    }

    // Auto focus focus-player button
    setTimeout(function () {
      var focusBtn = document.getElementById("btn-focus-player") || document.getElementById("btn-close-player");
      if (focusBtn) focusElement(focusBtn);
    }, 150);
  }

  function updatePlayerTitle() {
    var titleEl = document.getElementById("tv-player-modal-title");
    if (titleEl && state.currentPlaying) {
      var isTv = (state.currentPlaying.type === "tv" || state.currentPlaying.type === "anime");
      var epSuffix = isTv ? " (S" + state.currentSeason + " E" + state.currentEpisode + ")" : "";
      titleEl.innerHTML = escapeHtml(state.currentPlaying.title) + epSuffix;
    }
    var hdrBadge = document.getElementById("tv-hdr-ep-badge");
    if (hdrBadge && state.currentPlaying) {
      hdrBadge.innerHTML = "S" + state.currentSeason + " &bull; E" + state.currentEpisode;
    }
  }

  function setupEmbedPlayer(item) {
    var stage = document.getElementById("tv-player-stage");
    if (!stage) return;
    var streamUrl = getStreamUrl(state.currentServer, item.id, item.type, state.currentSeason, state.currentEpisode);
    stage.innerHTML = '<iframe class="tv-player-iframe" id="tv-stream-iframe" src="' + streamUrl + '" ' +
      'allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" ' +
      'allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture *" ' +
      'referrerpolicy="no-referrer"></iframe>';
    renderExternalBar(streamUrl);

    // Auto-focus video iframe so video starts without needing a mouse!
    setTimeout(function () {
      try {
        var ifr = document.getElementById("tv-stream-iframe");
        if (ifr) {
          ifr.focus();
        }
      } catch (e) {}
    }, 600);
  }

  function setupArchivePlayer(identifier) {
    var stage = document.getElementById("tv-player-stage");
    if (!stage) return;
    stage.innerHTML = '<div class="tv-state-panel"><div class="tv-spinner"></div><p>Resolving Public Domain Video stream...</p></div>';

    var metaUrl = "https://archive.org/metadata/" + encodeURIComponent(identifier);
    ajaxGet(metaUrl, function (res) {
      var files = (res && res.files) ? res.files : [];
      var videoFile = null;
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        if (f.name && /\.(mp4|m4v|webm)$/i.test(f.name) && !f.private) {
          videoFile = f.name;
          break;
        }
      }
      if (!videoFile && files.length > 0) {
        for (var j = 0; j < files.length; j++) {
          if (files[j].name && /\.(ogv|avi|mkv)$/i.test(files[j].name)) {
            videoFile = files[j].name;
            break;
          }
        }
      }

      if (videoFile) {
        var directUrl = "https://archive.org/download/" + identifier + "/" + encodeURIComponent(videoFile);
        state.archiveDirectUrl = directUrl;
        stage.innerHTML = '<video class="tv-player-video" id="tv-native-video" controls autoplay src="' + directUrl + '"></video>';
        renderExternalBar(directUrl);
      } else {
        stage.innerHTML = '<div class="tv-state-panel"><p style="color:#e50914;">Video stream not found in archive metadata.</p></div>';
      }
    }, function () {
      stage.innerHTML = '<div class="tv-state-panel"><p style="color:#e50914;">Failed to load archive stream.</p></div>';
    });
  }

  function renderServerBar() {
    var bar = document.getElementById("tv-player-servers");
    if (!bar) return;
    if (state.currentPlaying && state.currentPlaying.type === "archive") {
      bar.style.display = "none";
      return;
    }
    bar.style.display = "block";

    var html = '<span class="tv-server-label">Servers [1-9]:</span>';
    for (var i = 0; i < SERVERS_LIST.length; i++) {
      var s = SERVERS_LIST[i];
      var isAct = state.currentServer === s.id ? " active" : "";
      html += '<button type="button" class="tv-server-btn' + isAct + '" tabindex="0" data-nav="server" data-server="' + s.id + '">' +
        s.name + '</button>';

    bar.innerHTML = html;

  function renderExternalBar(url) {

      '<a class="tv-ext-link" tabindex="0" href="' + vlcIntent + '" target="_blank">&#9658; Launch VLC / MX Player</a>' +
      '<a class="tv-ext-link" tabindex="0" href="' + url + '" target="_blank">&#10532; Direct Stream Link</a>' +

          navigator.clipboard.writeText(url);

  function loadSeasons(item) {
    var epSec = document.getElementById("tv-player-episodes");
    if (!epSec) return;
    epSec.style.display = "block";
    epSec.innerHTML = '<div class="tv-state-panel" style="padding:16px 0;"><div class="tv-spinner"></div><p style="color:#888899; font-size:13px; margin-top:8px;">Loading seasons and episodes...</p></div>';

    var tvDetailUrl = "https://api.themoviedb.org/3/tv/" + item.id + "?api_key=" + TMDB_KEY;
    ajaxGet(tvDetailUrl, function (res) {
      var seasons = (res && res.seasons) ? res.seasons : [];
      state.seasonsList = [];
      for (var i = 0; i < seasons.length; i++) {
        if (seasons[i].season_number > 0) {
          state.seasonsList.push(seasons[i]);
        }
      }
      if (state.seasonsList.length === 0) {
        for (var k = 1; k <= 3; k++) {
          state.seasonsList.push({ season_number: k, name: "Season " + k, episode_count: 24 });
        }
      }

      var seasonExists = false;
      for (var s = 0; s < state.seasonsList.length; s++) {
        if (state.seasonsList[s].season_number === state.currentSeason) {
          seasonExists = true;
          break;
        }
      }
      if (!seasonExists && state.seasonsList.length > 0) {
        state.currentSeason = state.seasonsList[0].season_number;
      }

      renderSeasonsSection();
      loadEpisodes(item.id, state.currentSeason);
    }, function () {
      state.seasonsList = [
        { season_number: 1, name: "Season 1", episode_count: 24 },
        { season_number: 2, name: "Season 2", episode_count: 24 }
      ];
      renderSeasonsSection();
      loadEpisodes(item.id, state.currentSeason);
    });
  }

  function renderSeasonsSection() {
    var epSec = document.getElementById("tv-player-episodes");
    if (!epSec) return;

    var curSeasonInfo = null;
    for (var i = 0; i < state.seasonsList.length; i++) {
      if (state.seasonsList[i].season_number === state.currentSeason) {
        curSeasonInfo = state.seasonsList[i];
        break;
      }
    }
    var totalEps = (curSeasonInfo && curSeasonInfo.episode_count) ? curSeasonInfo.episode_count : (state.episodesList ? state.episodesList.length : 24);

    var html = '<div class="tv-episodes-head clearfix">' +
      '<span class="tv-episodes-heading">&#128250; Seasons &amp; Episodes</span>' +
      '<span class="tv-episodes-status" id="tv-episodes-status-text">Season ' + state.currentSeason + ' &bull; Ep ' + state.currentEpisode + '</span>' +
      '<span class="tv-ep-shortcut-hint">TV Shortcuts: <strong>[N]</strong> Next Ep &bull; <strong>[P]</strong> Prev Ep &bull; <strong>[S]</strong> Season</span>' +
      '</div>';

    // Season row
    html += '<div class="tv-seasons-bar" id="tv-seasons-bar">' +
      '<button type="button" class="tv-season-step-btn" id="btn-prev-season" tabindex="0" title="Previous Season">&#9664; Prev Season</button>';

    for (var j = 0; j < state.seasonsList.length; j++) {
      var s = state.seasonsList[j];
      var isAct = s.season_number === state.currentSeason ? " active" : "";
      var epCountLabel = s.episode_count ? ' (' + s.episode_count + ')' : '';
      html += '<button type="button" class="tv-season-btn' + isAct + '" tabindex="0" data-nav="season" data-season="' + s.season_number + '">' +
        'Season ' + s.season_number + epCountLabel +
      '</button>';
    }

    html += '<button type="button" class="tv-season-step-btn" id="btn-next-season" tabindex="0" title="Next Season">Next Season &#9654;</button>' +
      '</div>';

    // Episode Toolbar: Steppers, Range Tabs, Quick Jump
    html += '<div class="tv-episodes-toolbar clearfix" id="tv-episodes-toolbar">' +
      '<button type="button" class="tv-ep-step-btn" id="btn-prev-ep" tabindex="0" title="Previous Episode [P]">&#9664; Prev Ep [P]</button>' +
      '<button type="button" class="tv-ep-step-btn" id="btn-next-ep" tabindex="0" title="Next Episode [N]">Next Ep [N] &#9654;</button>';

    var rangeSize = 20;
    if (totalEps > rangeSize) {
      var numRanges = Math.ceil(totalEps / rangeSize);
      html += '<span style="margin-left:8px; margin-right:4px; font-size:12px; color:#8c8ca0;">Filter:</span>';
      for (var r = 0; r < numRanges; r++) {
        var startEp = r * rangeSize + 1;
        var endEp = Math.min((r + 1) * rangeSize, totalEps);
        var rAct = state.episodeRangeIndex === r ? " active" : "";
        html += '<button type="button" class="tv-ep-range-chip' + rAct + '" tabindex="0" data-nav="ep-range" data-range="' + r + '">' +
          startEp + '-' + endEp +
        '</button>';
      }
    }

    html += '<div class="tv-ep-jump-wrap">' +
      '<span>Jump to:</span>' +
      '<input type="number" class="tv-ep-jump-input" id="tv-ep-jump-val" min="1" max="' + (totalEps || 999) + '" value="' + state.currentEpisode + '" tabindex="0">' +
      '<button type="button" class="tv-btn tv-btn-secondary" id="btn-ep-jump-go" tabindex="0" style="padding:4px 8px; font-size:11px;">GO</button>' +
      '</div>';

    html += '</div>';

    html += '<div id="tv-episodes-grid" class="tv-episodes-grid"><div class="tv-spinner"></div></div>';
    epSec.innerHTML = html;

    bindSeasonControls();
  }

  function bindSeasonControls() {
    var jumpInput = document.getElementById("tv-ep-jump-val");
    if (jumpInput) {
      jumpInput.onkeydown = function (e) {
        if (e.keyCode === 13) {
          var val = parseInt(jumpInput.value, 10);
          if (!isNaN(val) && val > 0) {
            changeEpisode(val);
          }
        }
      };
    }
  }

  function changeSeason(seasonNum) {
    if (!state.currentPlaying) return;
    if (state.seasonsList && state.seasonsList.length > 0) {
      var exists = false;
      for (var s = 0; s < state.seasonsList.length; s++) {
        if (state.seasonsList[s].season_number === seasonNum) {
          exists = true;
          break;
        }
      }
      if (!exists) return;
    }
    state.currentSeason = seasonNum;
    state.currentEpisode = 1;
    state.episodeRangeIndex = 0;

    saveHistory(state.currentPlaying, state.currentSeason, state.currentEpisode);
    setupEmbedPlayer(state.currentPlaying);
    updatePlayerTitle();
    renderSeasonsSection();
    loadEpisodes(state.currentPlaying.id, state.currentSeason);
    showToast("Switched to Season " + seasonNum);
  }

  function cycleNextSeason() {
    if (!state.currentPlaying || !state.seasonsList || state.seasonsList.length === 0) return;
    var curIdx = -1;
    for (var i = 0; i < state.seasonsList.length; i++) {
      if (state.seasonsList[i].season_number === state.currentSeason) {
        curIdx = i;
        break;
      }
    }
    var nextIdx = (curIdx + 1) % state.seasonsList.length;
    changeSeason(state.seasonsList[nextIdx].season_number);
  }

  function cyclePrevSeason() {
    if (!state.currentPlaying || !state.seasonsList || state.seasonsList.length === 0) return;
    var curIdx = -1;
    for (var i = 0; i < state.seasonsList.length; i++) {
      if (state.seasonsList[i].season_number === state.currentSeason) {
        curIdx = i;
        break;
      }
    }
    var prevIdx = (curIdx - 1 + state.seasonsList.length) % state.seasonsList.length;
    changeSeason(state.seasonsList[prevIdx].season_number);
  }

  function closePlayer() {
    var modal = document.getElementById("tv-player-modal");
    if (modal) {
      modal.className = "tv-modal-backdrop";
      modal.classList.remove("cinema-mode");
    }
    var stage = document.getElementById("tv-player-stage");
    if (stage) {
      var iframes = stage.getElementsByTagName("iframe");
      for (var i = 0; i < iframes.length; i++) {
        try {
          iframes[i].src = "about:blank";
          if (iframes[i].contentWindow && iframes[i].contentWindow.document) {
            iframes[i].contentWindow.document.write("");
            iframes[i].contentWindow.close();
          }
        } catch (e) {}
      }
      var videos = stage.getElementsByTagName("video");
      for (var j = 0; j < videos.length; j++) {
        try {
          videos[j].pause();
          videos[j].removeAttribute("src");
          videos[j].load();
        } catch (e) {}
      }
      stage.innerHTML = "";
    }
    state.currentPlaying = null;
  }

  // --- TV Remote Spatial Navigation (D-Pad) Controller (Zero-Reflow Fast Engine) ---
  var currentFocusedElem = null;

  function getGridColumnCount() {
    var w = window.innerWidth || (document.documentElement ? document.documentElement.clientWidth : 1280);
    if (w <= 480) return 2;
    if (w <= 650) return 3;
    if (w <= 900) return 4;
    if (w <= 1200) return 5;
    return 6;
  }

  function getVisibleElements(selector, root) {
    var parent = root || document;
    var nodes = parent.querySelectorAll(selector);
    var list = [];
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if ((n.offsetWidth > 0 || n.offsetHeight > 0) && !n.disabled && n.getAttribute("tabindex") !== "-1") {
        list.push(n);
      }
    }
    return list;
  }

  function findNextInArray(arr, current, direction) {
    if (!arr || !arr.length) return null;
    var idx = arr.indexOf(current);
    if (idx === -1) return arr[0];
    if (direction === "right" || direction === "down") {
      return idx < arr.length - 1 ? arr[idx + 1] : arr[idx];
    } else {
      return idx > 0 ? arr[idx - 1] : arr[idx];
    }
  }

  function focusElement(el) {
    if (!el) return;
    if (currentFocusedElem && currentFocusedElem !== el) {
      currentFocusedElem.classList.remove("tv-focused");
    }
    currentFocusedElem = el;
    el.classList.add("tv-focused");
    try {
      el.focus();
    } catch (e) {}

    // Instant TV scroll into viewport without heavy smooth-scrolling animation loop
    try {
      if (el.scrollIntoViewIfNeeded) {
        el.scrollIntoViewIfNeeded(false);
      } else if (el.scrollIntoView) {
        el.scrollIntoView(false);
      }
    } catch (e) {}
  }

  function getEpGridColumns() {
    var w = window.innerWidth || (document.documentElement ? document.documentElement.clientWidth : 1280);
    if (w <= 520) return 1;
    if (w <= 850) return 2;
    if (w <= 1200) return 3;
    return 4;
  }

  function findNextFocusable(direction) {
    var openModal = document.querySelector(".tv-modal-backdrop.open");
    var cur = currentFocusedElem || document.activeElement;

    // --- CASE 1: MODAL IS OPEN (Player or Info) ---
    if (openModal) {
      if (openModal.id === "tv-player-modal") {
        var headerBtns = getVisibleElements(".tv-modal-header button, .tv-modal-actions button, #tv-player-quick-nav button", openModal);
        var serverBtns = getVisibleElements("#tv-player-servers .tv-server-btn", openModal);
        var seasonBtns = getVisibleElements("#tv-seasons-bar button", openModal);
        var toolbarBtns = getVisibleElements("#tv-episodes-toolbar button, #tv-episodes-toolbar input", openModal);
        var epCards = getVisibleElements("#tv-episodes-grid .tv-ep-card", openModal);
        var extLinks = getVisibleElements("#tv-player-ext-bar a, #tv-player-ext-bar button", openModal);
        var cols = getEpGridColumns();

        // Check if cur is inside epCards (2D grid navigation)
        var cardIdx = epCards.indexOf(cur);
        if (cardIdx !== -1) {
          if (direction === "left") {
            return cardIdx > 0 ? epCards[cardIdx - 1] : epCards[0];
          } else if (direction === "right") {
            return cardIdx < epCards.length - 1 ? epCards[cardIdx + 1] : epCards[cardIdx];
          } else if (direction === "up") {
            if (cardIdx >= cols) {
              return epCards[cardIdx - cols];
            } else {
              if (toolbarBtns.length) return toolbarBtns[0];
              if (seasonBtns.length) return seasonBtns[0];
              if (serverBtns.length) return serverBtns[0];
              return headerBtns.length ? headerBtns[0] : cur;
            }
          } else if (direction === "down") {
            if (cardIdx + cols < epCards.length) {
              return epCards[cardIdx + cols];
            } else if (extLinks.length) {
              return extLinks[0];
            }
            return cur;
          }
        }

        // Standard rows for player control bars
        var rows = [];
        if (headerBtns.length) rows.push(headerBtns);
        if (serverBtns.length) rows.push(serverBtns);
        if (seasonBtns.length) rows.push(seasonBtns);
        if (toolbarBtns.length) rows.push(toolbarBtns);
        if (epCards.length) rows.push(epCards.slice(0, Math.min(cols, epCards.length)));
        if (extLinks.length) rows.push(extLinks);

        var curRowIdx = -1;
        var curColIdx = -1;
        for (var r = 0; r < rows.length; r++) {
          var cIdx = rows[r].indexOf(cur);
          if (cIdx !== -1) {
            curRowIdx = r;
            curColIdx = cIdx;
            break;
          }
        }

        if (curRowIdx === -1) {
          var activeCard = openModal.querySelector(".tv-ep-card.active");
          if (activeCard) return activeCard;
          if (epCards.length) return epCards[0];
          if (seasonBtns.length) return seasonBtns[0];
          if (serverBtns.length) return serverBtns[0];
          return headerBtns.length ? headerBtns[0] : null;
        }

        if (direction === "left") {
          return curColIdx > 0 ? rows[curRowIdx][curColIdx - 1] : rows[curRowIdx][0];
        } else if (direction === "right") {
          return curColIdx < rows[curRowIdx].length - 1 ? rows[curRowIdx][curColIdx + 1] : rows[curRowIdx][rows[curRowIdx].length - 1];
        } else if (direction === "up") {
          if (curRowIdx > 0) {
            var targetRow = rows[curRowIdx - 1];
            return targetRow[Math.min(curColIdx, targetRow.length - 1)];
          }
          return rows[curRowIdx][curColIdx];
        } else if (direction === "down") {
          if (curRowIdx < rows.length - 1) {
            var targetRowDown = rows[curRowIdx + 1];
            return targetRowDown[Math.min(curColIdx, targetRowDown.length - 1)];
          }
          return rows[curRowIdx][curColIdx];
        }
        return null;
      }

      var modalFocusables = getVisibleElements("button, a, input", openModal);
      return findNextInArray(modalFocusables, cur, direction);
    }

    // --- CASE 2: MAIN SCREEN NAVIGATION ---
    var tabs = getVisibleElements(".tv-tab", document.getElementById("tv-nav-tabs"));
    var searchInput = document.getElementById("tv-search-input");
    var searchClear = document.getElementById("btn-search-clear");
    var quickTags = getVisibleElements(".tv-quick-tag", document.getElementById("tv-quick-search-bar"));
    var filterChips = getVisibleElements(".tv-chip", document.getElementById("tv-filter-bar"));
    var spotBtns = getVisibleElements("#tv-spotlight button");
    var historyCards = getVisibleElements("#tv-history-section .tv-card, #btn-clear-history");
    var gridCards = getVisibleElements(".tv-card[data-nav='card']", document.getElementById("tv-grid"));
    var pagBtns = getVisibleElements("#tv-pagination button");

    if (!cur) {
      var activeTab = document.querySelector(".tv-tab.active");
      return activeTab || (tabs.length ? tabs[0] : (gridCards.length ? gridCards[0] : null));
    }

    // Check if in Tabs
    var tabIdx = tabs.indexOf(cur);
    if (tabIdx !== -1) {
      if (direction === "left") {
        return tabIdx > 0 ? tabs[tabIdx - 1] : tabs[0];
      }
      if (direction === "right") {
        if (tabIdx < tabs.length - 1) return tabs[tabIdx + 1];
        return searchInput || tabs[tabIdx];
      }
      if (direction === "down") {
        if (quickTags.length) return quickTags[0];
        if (filterChips.length) return filterChips[0];
        if (spotBtns.length) return spotBtns[0];
        if (gridCards.length) return gridCards[0];
      }
      return tabs[tabIdx];
    }

    // Check if in Search
    if (cur === searchInput || cur === searchClear) {
      if (direction === "left") {
        if (cur === searchClear && searchInput) return searchInput;
        return tabs.length ? tabs[tabs.length - 1] : null;
      }
      if (direction === "right") {
        if (cur === searchInput && searchClear) return searchClear;
        return cur;
      }
      if (direction === "down") {
        if (quickTags.length) return quickTags[0];
        if (filterChips.length) return filterChips[0];
        if (spotBtns.length) return spotBtns[0];
        if (gridCards.length) return gridCards[0];
      }
      return cur;
    }

    // Check if in Quick Tags
    var tagIdx = quickTags.indexOf(cur);
    if (tagIdx !== -1) {
      if (direction === "left") {
        return tagIdx > 0 ? quickTags[tagIdx - 1] : quickTags[0];
      }
      if (direction === "right") {
        return tagIdx < quickTags.length - 1 ? quickTags[tagIdx + 1] : quickTags[tagIdx];
      }
      if (direction === "up") {
        var actTab = document.querySelector(".tv-tab.active");
        return actTab || (tabs.length ? tabs[0] : null);
      }
      if (direction === "down") {
        if (filterChips.length) return filterChips[0];
        if (spotBtns.length) return spotBtns[0];
        if (gridCards.length) return gridCards[0];
      }
      return cur;
    }

    // Check if in Filter Chips
    var chipIdx = filterChips.indexOf(cur);
    if (chipIdx !== -1) {
      if (direction === "left") {
        return chipIdx > 0 ? filterChips[chipIdx - 1] : filterChips[0];
      }
      if (direction === "right") {
        return chipIdx < filterChips.length - 1 ? filterChips[chipIdx + 1] : filterChips[chipIdx];
      }
      if (direction === "up") {
        if (quickTags.length) return quickTags[0];
        return tabs.length ? tabs[0] : null;
      }
      if (direction === "down") {
        if (spotBtns.length) return spotBtns[0];
        if (historyCards.length) return historyCards[0];
        if (gridCards.length) return gridCards[0];
      }
      return cur;
    }

    // Check if in Spotlight Buttons
    var spotIdx = spotBtns.indexOf(cur);
    if (spotIdx !== -1) {
      if (direction === "left") {
        return spotIdx > 0 ? spotBtns[spotIdx - 1] : spotBtns[0];
      }
      if (direction === "right") {
        return spotIdx < spotBtns.length - 1 ? spotBtns[spotIdx + 1] : spotBtns[spotIdx];
      }
      if (direction === "up") {
        if (filterChips.length) return filterChips[0];
        if (quickTags.length) return quickTags[0];
        return tabs.length ? tabs[0] : null;
      }
      if (direction === "down") {
        if (historyCards.length) return historyCards[0];
        if (gridCards.length) return gridCards[0];
      }
      return cur;
    }

    // Check if in History Cards
    var histIdx = historyCards.indexOf(cur);
    if (histIdx !== -1) {
      if (direction === "left") {
        return histIdx > 0 ? historyCards[histIdx - 1] : historyCards[0];
      }
      if (direction === "right") {
        return histIdx < historyCards.length - 1 ? historyCards[histIdx + 1] : historyCards[histIdx];
      }
      if (direction === "up") {
        if (spotBtns.length) return spotBtns[0];
        if (filterChips.length) return filterChips[0];
        return tabs.length ? tabs[0] : null;
      }
      if (direction === "down") {
        if (gridCards.length) return gridCards[0];
      }
      return cur;
    }

    // Check if in Media Cards Grid
    var cardIdx = gridCards.indexOf(cur);
    if (cardIdx !== -1) {
      var cols = getGridColumnCount();
      if (direction === "left") {
        return cardIdx > 0 ? gridCards[cardIdx - 1] : gridCards[0];
      }
      if (direction === "right") {
        return cardIdx < gridCards.length - 1 ? gridCards[cardIdx + 1] : gridCards[cardIdx];
      }
      if (direction === "up") {
        if (cardIdx >= cols) {
          return gridCards[cardIdx - cols];
        }
        if (historyCards.length) return historyCards[0];
        if (spotBtns.length) return spotBtns[0];
        if (filterChips.length) return filterChips[0];
        if (quickTags.length) return quickTags[0];
        return tabs.length ? tabs[0] : null;
      }
      if (direction === "down") {
        if (cardIdx + cols < gridCards.length) {
          return gridCards[cardIdx + cols];
        }
        if (pagBtns.length) return pagBtns[pagBtns.length - 1];
        return gridCards[cardIdx];
      }
      return cur;
    }

    // Check if in Pagination
    var pagIdx = pagBtns.indexOf(cur);
    if (pagIdx !== -1) {
      if (direction === "left") {
        return pagIdx > 0 ? pagBtns[pagIdx - 1] : pagBtns[0];
      }
      if (direction === "right") {
        return pagIdx < pagBtns.length - 1 ? pagBtns[pagIdx + 1] : pagBtns[pagIdx];
      }
      if (direction === "up") {
        if (gridCards.length) {
          var lastRowStart = Math.floor((gridCards.length - 1) / getGridColumnCount()) * getGridColumnCount();
          return gridCards[lastRowStart];
        }
        return null;
      }
      return cur;
    }

    // Fallback: fast scan
    var allFocusable = getVisibleElements("button, [tabindex='0'], input, a, .tv-card, .tv-tab, .tv-chip");
    return findNextInArray(allFocusable, cur, direction);
  }

  // Key Down Remote Controller Handler
  var lastBackPressTime = 0;
  function handleTVKeyDown(e) {
    var keyCode = e.keyCode || e.which;
    var activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";

    // Allow typing inside text input
    if (activeTag === "input") {
      if (keyCode === 13) {
        // Enter in search input
        state.searchQuery = document.getElementById("tv-search-input").value.trim();
        state.currentPage = 1;
        fetchMedia();
        return;
      }
      if (keyCode === 37 || keyCode === 39) {
        return; // Caret navigation
      }
    }

    // If in Player, numeric keys 1-9 switch streaming servers directly!
    var playerModal = document.getElementById("tv-player-modal");
    var isPlayerOpen = playerModal && playerModal.classList.contains("open");
    if (isPlayerOpen && keyCode >= 49 && keyCode <= 57) {
      var serverIndex = keyCode - 49;
      if (serverIndex < SERVERS_LIST.length) {
        var chosenServer = SERVERS_LIST[serverIndex];
        state.currentServer = chosenServer.id;
        setStorage(SERVER_STORAGE_KEY, chosenServer.id);
        renderServerBar();
        if (state.currentPlaying) {
          setupEmbedPlayer(state.currentPlaying);
        }
        showToast("Switched to " + chosenServer.name);
        return;
      }
    }

    // Remote Shortcuts for TV/Anime player: Next/Prev Episode & Season Switch
    if (isPlayerOpen && state.currentPlaying && (state.currentPlaying.type === "tv" || state.currentPlaying.type === "anime")) {
      // 'N' key (78) or FastForward (417/425) or Channel Up (33/427): Next Episode
      if (keyCode === 78 || keyCode === 417 || keyCode === 425 || keyCode === 33 || keyCode === 427) {
        e.preventDefault();
        changeEpisode(state.currentEpisode + 1);
        return;
      }
      // 'P' key (80) or Rewind (412/424) or Channel Down (34/428): Prev Episode
      if (keyCode === 80 || keyCode === 412 || keyCode === 424 || keyCode === 34 || keyCode === 428) {
        e.preventDefault();
        if (state.currentEpisode > 1) {
          changeEpisode(state.currentEpisode - 1);
        }
        return;
      }
      // 'S' key (83): Cycle Season
      if (keyCode === 83) {
        e.preventDefault();
        cycleNextSeason();
        return;
      }
      // 'E' key (69): Jump focus straight to episode section
      if (keyCode === 69) {
        e.preventDefault();
        var epSec = document.getElementById("tv-player-episodes");
        if (epSec) {
          var actCard = epSec.querySelector(".tv-ep-card.active") || epSec.querySelector(".tv-ep-card") || epSec.querySelector(".tv-season-btn.active") || epSec.querySelector("button");
          if (actCard) focusElement(actCard);
        }
        return;
      }
    }

    // Info Key (keyCode 73 for 'I' or 457 for TV remote Info key)
    if (keyCode === 73 || keyCode === 457) {
      if (currentFocusedElem && currentFocusedElem.getAttribute("data-nav") === "card") {
        var idx = parseInt(currentFocusedElem.getAttribute("data-index"), 10);
        if (state.items[idx]) {
          openInfoModal(state.items[idx]);
          return;
        }
      }
    }

    switch (keyCode) {
      case 38: // UP
        e.preventDefault();
        var nextUp = findNextFocusable("up");
        if (nextUp) focusElement(nextUp);
        break;

      case 40: // DOWN
        e.preventDefault();
        var nextDown = findNextFocusable("down");
        if (nextDown) focusElement(nextDown);
        break;

      case 37: // LEFT
        e.preventDefault();
        var nextLeft = findNextFocusable("left");
        if (nextLeft) focusElement(nextLeft);
        break;

      case 39: // RIGHT
        e.preventDefault();
        var nextRight = findNextFocusable("right");
        if (nextRight) focusElement(nextRight);
        break;

      case 13: // ENTER / OK
        if (currentFocusedElem && currentFocusedElem.click) {
          e.preventDefault();
          currentFocusedElem.click();
        }
        break;

      case 4: // Android System / Remote Back Key (CRITICAL FOR APK!)
      case 27: // ESC
      case 8: // Backspace (when not in input)
      case 461: // LG webOS Back
      case 10009: // Samsung Tizen Return
      case 10008: // Samsung Return
      case 10182: // Samsung Exit
      case 178: // TV Exit
      case 216: // Remote Exit
      case 88: // 'X' key shortcut
        if (activeTag !== "input" || keyCode === 27 || keyCode === 4) {
          e.preventDefault();
          e.stopPropagation();
          handleBackKey();
        }
        break;
    }
  }

  function handleBackKey() {
    var playerModal = document.getElementById("tv-player-modal");
    // 1. If player open and in cinema mode, return to regular player controls
    if (playerModal && playerModal.classList.contains("open")) {
      if (playerModal.classList.contains("cinema-mode")) {
        playerModal.classList.remove("cinema-mode");
        showToast("Restored player controls");
        return;
      }
      // Close player and return directly to movie grid
      closePlayer();
      showToast("Returned to browsing");
      return;
    }

    // 2. If info modal open, close it
    var infoModal = document.getElementById("tv-info-modal");
    if (infoModal && infoModal.classList.contains("open")) {
      closeInfoModal();
      return;
    }

    // 3. If in search query, clear it
    if (state.searchQuery) {
      state.searchQuery = "";
      var searchInput = document.getElementById("tv-search-input");
      if (searchInput) searchInput.value = "";
      state.currentPage = 1;
      fetchMedia();
      showToast("Cleared search");
      return;
    }

    // 4. If in genre filter, clear it
    if (state.currentGenre) {
      state.currentGenre = "";
      state.currentPage = 1;
      renderFilters();
      fetchMedia();
      return;
    }

    // 5. If on page > 1, go back to page 1
    if (state.currentPage > 1) {
      state.currentPage = 1;
      fetchMedia();
      showToast("Returned to Page 1");
      return;
    }

    // 6. If not on home tab, return to home
    if (state.currentTab !== "home") {
      state.currentTab = "home";
      state.currentCategory = "trending";
      state.currentPage = 1;
      renderTabs();
      renderFilters();
      fetchMedia();
      showToast("Returned to Home");
      return;
    }

    // 7. Otherwise warn user before exiting
    var now = new Date().getTime();
    if (now - lastBackPressTime < 3000) {
      // Exit app safely
      try {
        if (window.tizen && window.tizen.application) {
          window.tizen.application.getCurrentApplication().exit();
        } else if (window.webOS && window.webOS.platformBack) {
          window.webOS.platformBack();
        } else {
          window.history.go(-2);
        }
      } catch (e) {
        window.history.back();
      }
    } else {
      lastBackPressTime = now;
      showToast("Press [BACK / EXIT] again to exit app");
    }
  }

  // --- Click & Event Delegation ---
  function setupEventDelegation() {
    document.addEventListener("click", function (e) {
      var target = e.target;

      while (target && target !== document.body) {
        // Tab button
        if (target.getAttribute("data-nav") === "tab") {
          var tabId = target.getAttribute("data-tab");
          if (tabId && tabId !== state.currentTab) {
            state.currentTab = tabId;
            state.currentCategory = "trending";
            state.currentGenre = "";
            state.searchQuery = "";
            state.currentPage = 1;
            renderTabs();
            renderFilters();
            fetchMedia();
          }
          return;
        }

        // Category button
        if (target.getAttribute("data-nav") === "cat") {
          var catId = target.getAttribute("data-cat");
          if (catId) {
            state.currentCategory = catId;
            state.currentPage = 1;
            renderFilters();
            fetchMedia();
          }
          return;
        }

        // Genre chip
        if (target.getAttribute("data-nav") === "genre") {
          var gId = target.getAttribute("data-genre");
          state.currentGenre = gId || "";
          state.currentPage = 1;
          renderFilters();
          fetchMedia();
          return;
        }

        // Quick search tag
        if (target.getAttribute("data-quick")) {
          var term = target.getAttribute("data-quick");
          var sInput = document.getElementById("tv-search-input");
          if (sInput) sInput.value = term;
          state.searchQuery = term;
          state.currentPage = 1;
          fetchMedia();
          return;
        }

        // Media Card
        if (target.getAttribute("data-nav") === "card") {
          var cardIdx = parseInt(target.getAttribute("data-index"), 10);
          var mediaItem = state.items[cardIdx];
          if (mediaItem) {
            openPlayer(mediaItem);
          }
          return;
        }

        // Continue Watching Card
        if (target.getAttribute("data-nav") === "history-card") {
          var histId = target.getAttribute("data-id");
          for (var i = 0; i < state.history.length; i++) {
            if (String(state.history[i].id) === String(histId)) {
              openPlayer(state.history[i], state.history[i].resumeSeason, state.history[i].resumeEpisode);
              break;
            }
          }
          return;
        }

        // Spotlight buttons
        if (target.id === "btn-spotlight-play") {
          if (state.spotlightItem) openPlayer(state.spotlightItem);
          return;
        }
        if (target.id === "btn-spotlight-info") {
          if (state.spotlightItem) openInfoModal(state.spotlightItem);
          return;
        }
        if (target.id === "btn-spotlight-bookmark") {
          if (state.spotlightItem) toggleWatchlist(state.spotlightItem);
          return;
        }

        // Pagination buttons
        if (target.id === "btn-page-prev") {
          if (state.currentPage > 1) {
            state.currentPage--;
            fetchMedia(function () {
              window.scrollTo(0, 0);
            });
          }
          return;
        }
        if (target.id === "btn-page-next") {
          if (state.currentPage < state.totalPages) {
            state.currentPage++;
            fetchMedia(function () {
              window.scrollTo(0, 0);
            });
          }
          return;
        }

        // Clear history button
        if (target.id === "btn-clear-history") {
          state.history = [];
          setStorage(HISTORY_STORAGE_KEY, []);
          renderContinueWatching();
          showToast("Watch history cleared");
          return;
        }

        // Close Player Modal
        if (target.id === "btn-close-player" || target.id === "tv-player-modal") {
          if (target.id === "btn-close-player" || e.target === target) {
            closePlayer();
            showToast("Returned to browsing");
          }
          return;
        }

        // Toggle Fullscreen / Cinema Mode
        if (target.id === "btn-fullscreen-player") {
          toggleCinemaMode();
          return;
        }

        // Focus Video Player for Remote Control
        if (target.id === "btn-focus-player") {
          focusVideoPlayer();
          return;
        }

        // Close Info Modal
        if (target.id === "btn-close-info" || target.id === "tv-info-modal") {
          if (target.id === "btn-close-info" || e.target === target) {
            closeInfoModal();
          }
          return;
        }

        // Server Switch Button
        if (target.getAttribute("data-nav") === "server") {
          var sId = target.getAttribute("data-server");
          if (sId && state.currentPlaying) {
            state.currentServer = sId;
            setStorage(SERVER_STORAGE_KEY, sId);
            renderServerBar();
            setupEmbedPlayer(state.currentPlaying);
          }
          return;
        }

        // Season Selection Chip
        if (target.getAttribute("data-nav") === "season") {
          var sNum = parseInt(target.getAttribute("data-season"), 10) || 1;
          changeSeason(sNum);
          return;
        }

        // Season Steppers
        if (target.id === "btn-prev-season") {
          cyclePrevSeason();
          return;
        }
        if (target.id === "btn-next-season") {
          cycleNextSeason();
          return;
        }

        // Episode Range Filter Chip
        if (target.getAttribute("data-nav") === "ep-range") {
          var rIdx = parseInt(target.getAttribute("data-range"), 10) || 0;
          state.episodeRangeIndex = rIdx;
          renderSeasonsSection();
          renderEpisodesGrid();
          return;
        }

        // Episode Steppers (Header and Toolbar)
        if (target.id === "btn-prev-ep" || target.id === "tv-hdr-prev-ep") {
          if (state.currentEpisode > 1) {
            changeEpisode(state.currentEpisode - 1);
          }
          return;
        }
        if (target.id === "btn-next-ep" || target.id === "tv-hdr-next-ep") {
          changeEpisode(state.currentEpisode + 1);
          return;
        }

        // Header Jump to Episodes Button
        if (target.id === "tv-hdr-jump-ep") {
          var epDrawer = document.getElementById("tv-player-episodes");
          if (epDrawer) {
            epDrawer.scrollIntoView({ behavior: "smooth", block: "start" });
            var targetFocus = epDrawer.querySelector(".tv-ep-card.active") || epDrawer.querySelector(".tv-ep-card") || epDrawer.querySelector(".tv-season-btn.active") || epDrawer.querySelector("button");
            if (targetFocus) focusElement(targetFocus);
          }
          return;
        }

        // Episode Jump Go Button
        if (target.id === "btn-ep-jump-go") {
          var jumpInput = document.getElementById("tv-ep-jump-val");
          if (jumpInput) {
            var val = parseInt(jumpInput.value, 10);
            if (!isNaN(val) && val > 0) {
              changeEpisode(val);
            }
          }
          return;
        }

        // Episode Card or Button
        if (target.getAttribute("data-nav") === "ep-card" || target.getAttribute("data-nav") === "ep") {
          var epNum = parseInt(target.getAttribute("data-ep"), 10) || 1;
          changeEpisode(epNum);
          return;
        }

        target = target.parentNode;
      }
    });

    // Hover / Focus tracking
    document.addEventListener("focusin", function (e) {
      if (e.target && e.target !== currentFocusedElem) {
        if (currentFocusedElem) currentFocusedElem.classList.remove("tv-focused");
        currentFocusedElem = e.target;
        currentFocusedElem.classList.add("tv-focused");
      }
    });

    var searchClearBtn = document.getElementById("btn-search-clear");
    if (searchClearBtn) {
      searchClearBtn.onclick = function () {
        var searchInput = document.getElementById("tv-search-input");
        if (searchInput) searchInput.value = "";
        state.searchQuery = "";
        state.currentPage = 1;
        fetchMedia();
      };
    }

    // Window remote key listener
    window.addEventListener("keydown", handleTVKeyDown);
  }

  // --- Cinema Mode & Video Remote Focus Helpers ---
  function toggleCinemaMode() {
    var modal = document.getElementById("tv-player-modal");
    if (!modal) return;
    if (modal.classList.contains("cinema-mode")) {
      modal.classList.remove("cinema-mode");
      showToast("Standard View Restored");
    } else {
      modal.classList.add("cinema-mode");
      // Try HTML5 Fullscreen API if supported
      try {
        var elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.mozRequestFullScreen) {
          elem.mozRequestFullScreen();
        }
      } catch (err) {}
      showToast("Cinema Mode (100% Screen) - Press BACK for controls");
    }
  }

  function focusVideoPlayer() {
    var iframe = document.getElementById("tv-stream-iframe");
    var video = document.getElementById("tv-native-video");
    if (iframe) {
      try {
        iframe.focus();
        showToast("Player Focused: Press Remote [OK] to Start");
      } catch (e) {}
    } else if (video) {
      try {
        video.focus();
        if (video.paused) {
          video.play();
          showToast("Playing");
        } else {
          video.pause();
          showToast("Paused");
        }
      } catch (e) {}
    }
  }

  // Guard browser history so Android TV / APK WebView Back does not exit app
  function initHistoryGuard() {
    try {
      if (window.history && window.history.pushState) {
        window.history.pushState({ page: "writerstm_app" }, "");
        window.addEventListener("popstate", function (e) {
          handleBackKey();
          try {
            window.history.pushState({ page: "writerstm_app" }, "");
          } catch (err) {}
        });
      }
    } catch (e) {}

    // Register Smart TV Remote Keys (Tizen, webOS)
    try {
      if (window.tizen && window.tizen.tvinputdevice) {
        window.tizen.tvinputdevice.registerKey("Return");
        window.tizen.tvinputdevice.registerKey("Exit");
        window.tizen.tvinputdevice.registerKey("Info");
      }
    } catch (e) {}
  }

  // --- App Initialization ---
  function initApp() {
    initHistoryGuard();
    renderTabs();
    renderFilters();
    renderContinueWatching();
    setupEventDelegation();
    fetchMedia(function () {
      var firstTab = document.querySelector(".tv-tab.active") || document.querySelector(".tv-tab");
      if (firstTab) focusElement(firstTab);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initApp);
  } else {
    initApp();
  }

})();

</script>
