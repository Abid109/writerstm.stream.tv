name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 10406996
          packages: 'platforms;android-33 build-tools;33.0.0 platform-tools'

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Gradle 8.0
        run: |
          wget https://services.gradle.org/distributions/gradle-8.0-bin.zip -O gradle.zip
          unzip -q gradle.zip
          sudo mv gradle-8.0 /opt/gradle
          sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Sign APK with debug key
        run: |
          cd android
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ${ANDROID_SDK_ROOT}/build-tools/33.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --in app/build/outputs/apk/release/app-release-unsigned.apk --out app/build/outputs/apk/release/app-release-signed.apk
          ${ANDROID_SDK_ROOT}/build-tools/33.0.0/apksigner verify app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: writerstm-signed-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30
