    <style>
        /* Fallback styles in case Tailwind gets blocked by shields */
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #000; color: #fff; }
        .hidden { display: none !important; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b91c1c; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Watchlist button styles */
        .bookmark-btn { transition: all 0.2s; }
        .bookmark-btn:hover { transform: scale(1.1); }
        .bookmark-btn.active i { color: #dc2626; /* red-600 */ }
        .bookmark-btn.active i::before { content: "\e93e"; /* ph-fill ph-bookmark */ }
        
        /* Hide scrollbar for mobile tabs but keep them scrollable */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Global Focus Styles for TV Remotes / Keyboard Navigation */
        *:focus-visible { outline: 2px solid #dc2626; outline-offset: 2px; }
        
        .click-shield {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            transition: opacity 0.3s;
        }
        .click-shield:hover i { transform: scale(1.1); color: #dc2626; }
        .click-shield.resolved { display: none; }
        
        /* Ensure iframe fills container in fullscreen */
        #videoContainer:-webkit-full-screen { width: 100vw; height: 100vh; background: black; }
        #videoContainer:-ms-fullscreen { width: 100vw; height: 100vh; background: black; }
        #videoContainer:fullscreen { width: 100vw; height: 100vh; background: black; }
        
        /* Fallback Fullscreen for WebViews (APKs) */
        .webview-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            background: black !important;
        }
        
        /* Force landscape visually if device is held in portrait and manifest is locked */
        @media (orientation: portrait) {
            .webview-fullscreen.force-landscape {
                /* When in portrait mode, we need to swap width and height */
                /* to make the video display sideways across the screen. */
                top: 50% !important;
                left: 50% !important;
                width: 100vh !important;
                height: 100vw !important;
                /* Translate back to center and rotate 90 degrees */
                transform: translate(-50%, -50%) rotate(90deg) !important;
            }
        }

        #floatingExitBtn { display: none; }
        .webview-fullscreen #floatingExitBtn { display: flex !important; }
    
        /* ========== TV EDITION ENHANCEMENTS ========== */

        /* 1. Overscan Safe Area - critical for TV displays */
        @media screen and (min-width: 1024px) {
            body { padding: 0 60px; }
            main { max-width: 100%; padding-left: 0; padding-right: 0; }
            nav .max-w-7xl { max-width: 100%; padding-left: 0; padding-right: 0; }
        }
        @media screen and (min-width: 1920px) {
            body { padding: 0 100px; }
        }

        /* 2. Larger Base Typography for couch viewing distance */
        html { font-size: 18px; }
        @media (min-width: 1280px) { html { font-size: 20px; } }
        @media (min-width: 1920px) { html { font-size: 24px; } }

        /* 3. Enhanced Focus Rings for TV Remotes - highly visible */
        *:focus-visible {
            outline: 5px solid #dc2626 !important;
            outline-offset: 5px !important;
            box-shadow: 0 0 0 10px rgba(220, 38, 38, 0.15), 0 0 30px rgba(220, 38, 38, 0.6) !important;
            z-index: 100;
            position: relative;
            transition: box-shadow 0.15s ease, outline 0.15s ease;
        }

        /* 4. Group Focus States - mirror hover for remote users */
        .group:focus-visible .group-focus-visible\:opacity-100,
        .group:hover .group-focus-visible\:opacity-100 { opacity: 1; }
        .group:focus-visible .group-focus-visible\:scale-105,
        .group:hover .group-focus-visible\:scale-105 { transform: scale(1.05); }
        .group:focus-visible .group-focus-visible\:border-red-600,
        .group:hover .group-focus-visible\:border-red-600 { border-color: #dc2626; }
        .group:focus-visible .group-focus-visible\:text-red-400,
        .group:hover .group-focus-visible\:text-red-400 { color: #f87171; }

        /* 5. TV-Optimized Grid - fewer, larger items readable from 3 meters */
        @media (min-width: 1280px) {
            #mediaGrid { grid-template-columns: repeat(4, 1fr) !important; gap: 2.5rem !important; }
        }
        @media (min-width: 1600px) {
            #mediaGrid { grid-template-columns: repeat(5, 1fr) !important; gap: 3rem !important; }
        }
        @media (min-width: 1920px) {
            #mediaGrid { grid-template-columns: repeat(6, 1fr) !important; gap: 3.5rem !important; }
        }

        /* 6. Minimum Target Size for Remote Controls (Android TV / WebView) */
        button, select, input, [tabindex="0"], a, .click-shield {
            min-height: 52px;
            min-width: 52px;
        }

        /* 7. Smooth scrolling for focus changes */
        html { scroll-behavior: smooth; }

        /* 8. TV-friendly sidebar width */
        @media (min-width: 1024px) {
            #tvSidebar { width: 28rem; }
        }

        /* 9. Larger player controls for remote accuracy */
        #fullscreenBtn, #adBlockToggle, .audio-toggle-btn {
            padding: 0.85rem 1.5rem !important;
            font-size: 1.05rem !important;
            min-height: 52px;
        }

        /* 10. Loading spinners larger */
        #mainLoader i, #playerLoader i { font-size: 4rem; }

        /* 11. Card focus lift effect - clear TV feedback */
        .group:focus-visible { 
            transform: scale(1.04); 
            z-index: 10; 
            transition: transform 0.2s ease;
        }

        /* 12. Modal focus management */
        #playerModal { outline: none; }

        /* 13. Thicker scrollbar for TV visibility */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 7px; border: 3px solid #000; }

        /* 14. Prevent text selection with remote (reduces accidental highlights) */
        body {
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea {
            -webkit-user-select: auto;
            user-select: auto;
        }

        /* 15. Ensure click shield is obviously focusable */
        .click-shield:focus-visible {
            background: rgba(0,0,0,0.6) !important;
            outline: 5px solid #dc2626 !important;
        }
        .click-shield:focus-visible i {
            transform: scale(1.2);
            color: #dc2626;
        }

    
        /* ========== APK FULLSCREEN & TV COVERAGE ========== */

        /* 1. Full coverage without forcing height */
        html, body {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            background-color: #000 !important;
        }

        /* 2. Prevent any mobile bounce / overscroll */
        body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            touch-action: none;
        }

        /* 3. Main container fills entire APK window */
        main {
            min-height: 100vh;
            min-height: 100dvh; /* dynamic viewport height for modern WebView */
            padding-bottom: 40px; /* safe area for TV overscan bottom */
        }

        /* 4. Navbar stays fixed but respects TV safe zone */
        nav {
            padding-top: env(safe-area-inset-top, 20px);
            padding-left: env(safe-area-inset-left, 40px);
            padding-right: env(safe-area-inset-right, 40px);
        }

        /* 5. Footer pushed to bottom with safe margin */
        footer {
            margin-bottom: env(safe-area-inset-bottom, 30px);
        }

        /* 6. APK Splash / Loading screen while WebView initializes */
        #apkSplash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        #apkSplash.hidden { opacity: 0; pointer-events: none; }
        #apkSplash .splash-logo {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(220,38,38,0.4);
        }
        #apkSplash .splash-logo span {
            color: #000;
            font-size: 64px;
            font-weight: 900;
            font-family: serif;
        }
        #apkSplash .splash-text {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        #apkSplash .splash-bar {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        #apkSplash .splash-bar-inner {
            width: 0%;
            height: 100%;
            background: #dc2626;
            animation: splashLoad 1.5s ease-out forwards;
        }
        @keyframes splashLoad {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        

        /* 8. Hide scrollbar globally in APK */
        ::-webkit-scrollbar { width: 0px !important; background: transparent; }

        /* 9. Ensure video container truly fills in APK fullscreen */
        #videoContainer {
            width: 100vw !important;
            height: 100vh !important;
        }

        /* 10. Responsive grid for any orientation */
        @media (max-width: 480px) {
            #mediaGrid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            #mediaGrid { grid-template-columns: repeat(3, 1fr) !important; gap: 16px !important; }
        }
        @media (min-width: 769px) and (max-width: 1200px) {
            #mediaGrid { grid-template-columns: repeat(4, 1fr) !important; gap: 20px !important; }
        }
        @media (min-width: 1201px) and (max-width: 1600px) {
            #mediaGrid { grid-template-columns: repeat(5, 1fr) !important; gap: 24px !important; }
        }
        @media (min-width: 1601px) {
            #mediaGrid { grid-template-columns: repeat(6, 1fr) !important; gap: 28px !important; }
        }

    <script>
        // ========== APK FULLSCREEN & IMMERSIVE MODE ==========

        // 1. Request fullscreen immediately on load (for WebView APKs)
        function requestAPKFullscreen() {
            var docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(function(){});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else if (docEl.mozRequestFullScreen) {
                docEl.mozRequestFullScreen();
            } else if (docEl.msRequestFullscreen) {
                docEl.msRequestFullscreen();
            }
        }

        // 2. Hide splash after everything loads
        function hideSplash() {
            var splash = document.getElementById("apkSplash");
            if (splash) {
                splash.classList.add("hidden");
                setTimeout(function() {
                    splash.style.display = "none";
                }, 800);
            }
        }

        // 3. Keep screen awake while watching (Wake Lock API with fallback)
        var wakeLock = null;
        function requestWakeLock() {
            if ("wakeLock" in navigator) {
                navigator.wakeLock.request("screen").then(function(lock) {
                    wakeLock = lock;
                    wakeLock.addEventListener("release", function() {
                        requestWakeLock();
                    });
                }).catch(function(){});
            }
        }

        // 4. Re-acquire wake lock when user returns to app
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "visible") {
                requestWakeLock();
            }
        });

        // 5. Android Back Button Handler
        // Priority: 1) Exit fullscreen  2) Close player modal  3) Exit app
        document.addEventListener("keydown", function(e) {
            if (e.key === "Backspace" || e.key === "Escape") {
                // First priority: exit fullscreen if active
                if (videoContainer.classList.contains("webview-fullscreen") || document.fullscreenElement) {
                    e.preventDefault();
                    exitFullscreen();
                    return;
                }
                // Second priority: close player modal
                if (!playerModal.classList.contains("hidden")) {
                    e.preventDefault();
                    closeModalBtn.click();
                    return;
                }
                // Third: if on home screen, let APK wrapper exit the app
                // Or call Android bridge if available
                if (window.Android && window.Android.onBackPressed) {
                    window.Android.onBackPressed();
                }
            }
        });

        // 6. Prevent context menu (long press) in APK
        document.addEventListener("contextmenu", function(e) {
            e.preventDefault();
            return false;
        });

        // 7. Prevent double-tap zoom
        var lastTouchEnd = 0;
        document.addEventListener("touchend", function(e) {
            var now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // 8. Auto-request fullscreen and wake lock on first interaction
        var apkInitialized = false;
        function initAPK() {
            if (apkInitialized) return;
            apkInitialized = true;
            requestAPKFullscreen();
            requestWakeLock();
            hideSplash();
        }

        document.addEventListener("click", initAPK, { once: true });
        document.addEventListener("touchstart", initAPK, { once: true });
        document.addEventListener("keydown", initAPK, { once: true });

        // Auto-hide splash after 3 seconds even without interaction
        setTimeout(initAPK, 3000);

        // 9. Handle window resize for TV overscan adjustment
        function adjustForTV() {
            var w = window.innerWidth;
            var h = window.innerHeight;
            // If very wide (TV), increase padding
            if (w > 1200) {
                document.body.style.paddingLeft = "60px";
                document.body.style.paddingRight = "60px";
            }
            if (w > 1800) {
                document.body.style.paddingLeft = "100px";
                document.body.style.paddingRight = "100px";
            }
        }
        window.addEventListener("resize", adjustForTV);
        adjustForTV();

        // 10. JS Bridge for Android (if wrapper supports it)
        if (window.Android && window.Android.showToast) {
            // Native Android bridge detected
            window.Android.showToast("Writerstm.stream loaded");
        }


        // ========== POLYFILLS FOR VERY OLD BROWSERS ==========
        if (!Array.prototype.forEach) {
            Array.prototype.forEach = function(callback, thisArg) {
                for (var i = 0; i < this.length; i++) {
                    callback.call(thisArg, this[i], i, this);
                }
            };
        }
        if (!window.NodeList || !NodeList.prototype.forEach) {
            if (window.NodeList) {
                NodeList.prototype.forEach = Array.prototype.forEach;
            }
        }
        if (!Element.prototype.matches) {
            Element.prototype.matches = Element.prototype.msMatchesSelector || Element.prototype.webkitMatchesSelector;
        }
        if (!Element.prototype.closest) {
            Element.prototype.closest = function(s) {
                var el = this;
                do {
                    if (el.matches(s)) return el;
                    el = el.parentElement || el.parentNode;
                } while (el !== null && el.nodeType === 1);
                return null;
            };
        }
        if (!Array.from) {
            Array.from = function(arrayLike) {
                var arr = [];
                for (var i = 0; i < arrayLike.length; i++) {
                    arr.push(arrayLike[i]);
                }
                return arr;
            };
        }
        if (!String.prototype.includes) {
            String.prototype.includes = function(search) {
                return this.indexOf(search) !== -1;
            };
        }
        if (!Object.assign) {
            Object.assign = function(target) {
                for (var i = 1; i < arguments.length; i++) {
                    var source = arguments[i];
                    for (var key in source) {
                        if (source.hasOwnProperty(key)) {
                            target[key] = source[key];
                        }
                    }
                }
                return target;
            };
        }

        // ========== XMLHttpRequest HELPER (replaces fetch) ==========
        function makeRequest(url, onSuccess, onError) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            onSuccess(data);
                        } catch (e) {
                            if (onError) onError(e);
                        }
                    } else {
                        if (onError) onError(new Error("HTTP " + xhr.status));
                    }
                }
            };
            xhr.onerror = function() {
                if (onError) onError(new Error("Network error"));
            };
            xhr.send();
        }

        // ========== APP STATE ==========
        var TMDB_API_KEY = "3fd2be6f0c70a2a598f084ddfb75487c";
        var currentType = "movie";
        var currentCategory = "trending";
        var currentGenre = "";
        var currentQuery = "";
        var currentPage = 1;
        var isWatchlistView = false;
        var watchlist = [];
        var currentMediaId = null;
        var currentMediaObj = null;
        var currentSeason = 1;
        var currentEpisode = 1;
        var currentAudioType = "sub";
        var isAdShieldActive = true;
        var lastFocusedGridItem = null;
        var tvNavInitialized = false;

        // ========== DOM REFERENCES ==========
        var mediaGrid = document.getElementById("mediaGrid");
        var mainLoader = document.getElementById("mainLoader");
        var searchInput = document.getElementById("searchInput");

        // ========== INIT ==========
        document.addEventListener("DOMContentLoaded", function() {
            loadWatchlist();

        // ========== WATCHLIST ==========
        function safeStorageAccess() {
            try {
                var testKey = "__test__";
                localStorage.setItem(testKey, testKey);
                localStorage.removeItem(testKey);
                return true;
            } catch (e) {
                return false;
            }
        }

        function loadWatchlist() {
            if (safeStorageAccess()) {
                try {
                    var stored = localStorage.getItem("writerstm_watchlist");
                    if (stored) {
                        var parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) watchlist = parsed;
                    }
                } catch (e) {
                    watchlist = [];
                }
            }
            updateWatchlistUI();
        }

        function saveWatchlist() {
            if (safeStorageAccess()) {
                localStorage.setItem("writerstm_watchlist", JSON.stringify(watchlist));
            }
        }

        function toggleBookmark(mediaItem, event) {
            if (event) event.stopPropagation();
            var index = -1;
            for (var i = 0; i < watchlist.length; i++) {
                if (watchlist[i].id === mediaItem.id && watchlist[i].type === mediaItem.type) {
                    index = i;
                    break;
                }
            }
            if (index > -1) {
                watchlist.splice(index, 1);
            } else {
                watchlist.push(mediaItem);
            }
            saveWatchlist();
            if (isWatchlistView) {
                renderGrid(watchlist);
            } else {
                var gridBtn = document.querySelector('.grid-bookmark[data-id="' + mediaItem.id + '"]');
                if (gridBtn) {
                    if (index > -1) gridBtn.classList.remove("active");
                    else gridBtn.classList.add("active");
                }
            }
            updateWatchlistUI();
            if (currentMediaObj && currentMediaObj.id === mediaItem.id) {
                updateModalBookmarkBtn();
            }
        }

        function updateWatchlistUI() {
            var count = watchlist.length;
            var html = '<i class="ph-fill ph-bookmarks text-xl ';
            if (isWatchlistView) html += 'text-red-600 drop-shadow-[0_0_5px_rgba(220,38,38,0.8)]';
            html += '"></i><span class="hidden sm:inline text-sm font-medium ';
            if (isWatchlistView) html += 'text-white';
            html += '">Watchlist ';
            if (count > 0) html += "(" + count + ")";
            html += "</span>";
            viewWatchlistBtn.innerHTML = html;
        }

        viewWatchlistBtn.addEventListener("click", function() {
            isWatchlistView = !isWatchlistView;
            if (isWatchlistView) {
                var btns = Array.from(tabBtns);
                for (var i = 0; i < btns.length; i++) {
                    btns[i].classList.remove("bg-red-600", "text-white", "shadow-sm");
                    btns[i].classList.add("text-zinc-400");
                }
                categoryFilter.disabled = true;
                genreFilter.disabled = true;
                categoryFilter.classList.add("opacity-50");
                genreFilter.classList.add("opacity-50");
                sectionTitle.textContent = "My Watchlist";
                clearWatchlistBtn.classList.remove("hidden");
                pagination.classList.add("hidden");
                renderGrid(watchlist);
            } else {
                categoryFilter.disabled = false;
                genreFilter.disabled = false;
                categoryFilter.classList.remove("opacity-50");
                genreFilter.classList.remove("opacity-50");
                clearWatchlistBtn.classList.add("hidden");
                var activeBtn = document.querySelector('[data-type="' + currentType + '"]');
                if (activeBtn) activeBtn.click();
            }
            updateWatchlistUI();
        });

        clearWatchlistBtn.addEventListener("click", function() {
            if (confirm("Are you sure you want to clear your watchlist?")) {
                watchlist = [];
                saveWatchlist();
                renderGrid(watchlist);
                updateWatchlistUI();
            }
        });

        // ========== GENRES ==========
        function loadGenres() {
            if (currentType === "anime") {
                var categories = [
                    {id: "Action", name: "Action"}, {id: "Adventure", name: "Adventure"},
                    {id: "Comedy", name: "Comedy"}, {id: "Drama", name: "Drama"},
                    {id: "Fantasy", name: "Fantasy"}, {id: "Horror", name: "Horror"},
                    {id: "Romance", name: "Romance"}, {id: "Sci-Fi", name: "Sci-Fi"}
                ];
                populateGenreSelect(categories);
            } else {
                var url = "https://api.themoviedb.org/3/genre/" + currentType + "/list?api_key=" + TMDB_API_KEY;
                makeRequest(url, function(data) {
                    if (data && data.genres) populateGenreSelect(data.genres);
                }, function(e) {
                    console.error("Genre load error", e);
                });
            }
        }

        function populateGenreSelect(genres) {
            genreFilter.innerHTML = '<option value="">All Genres</option>';
            for (var i = 0; i < genres.length; i++) {
                var g = genres[i];
                var opt = document.createElement("option");
                opt.value = g.id || g.name;
                opt.textContent = g.name;
                if (currentGenre === opt.value) opt.selected = true;
                genreFilter.appendChild(opt);
            }
        }

        // ========== EVENT LISTENERS ==========
        var tabBtnArray = Array.from(tabBtns);
        for (var i = 0; i < tabBtnArray.length; i++) {
            tabBtnArray[i].addEventListener("click", function(e) {
                var btn = e.target;
                if (isWatchlistView) {
                    isWatchlistView = false;
                    categoryFilter.disabled = false;
                    genreFilter.disabled = false;
                    categoryFilter.classList.remove("opacity-50");
                    genreFilter.classList.remove("opacity-50");
                    clearWatchlistBtn.classList.add("hidden");
                    updateWatchlistUI();
                }
                for (var j = 0; j < tabBtnArray.length; j++) {
                    tabBtnArray[j].classList.remove("bg-red-600", "text-white", "shadow-sm");
                    tabBtnArray[j].classList.add("text-zinc-400");
                }
                btn.classList.remove("text-zinc-400");
                btn.classList.add("bg-red-600", "text-white", "shadow-sm");
                currentType = btn.dataset.type;
                var ph = "Search movies...";
                if (currentType === "tv") ph = "Search TV series...";
                if (currentType === "anime") ph = "Search anime...";
                searchInput.placeholder = ph;
                mobileSearchInput.placeholder = ph;
                currentQuery = "";
                searchInput.value = "";
                mobileSearchInput.value = "";
                currentGenre = "";
                currentPage = 1;
                loadGenres();
                fetchMedia();
            });
        }

        categoryFilter.addEventListener("change", function(e) {
            currentCategory = e.target.value;
            currentPage = 1;
            fetchMedia();
        });

        genreFilter.addEventListener("change", function(e) {
            currentGenre = e.target.value;
            currentPage = 1;
            fetchMedia();
        });

        function handleSearch(e) {
            if (e.key === "Enter") {
                currentQuery = e.target.value;
                currentPage = 1;
                if (isWatchlistView) viewWatchlistBtn.click();
                else fetchMedia();
            }
        }
        searchInput.addEventListener("keypress", handleSearch);
        mobileSearchInput.addEventListener("keypress", handleSearch);

        prevPageBtn.addEventListener("click", function() {
            if (currentPage > 1) {
                currentPage--;
                fetchMedia();
            }
        });
        nextPageBtn.addEventListener("click", function() {
            currentPage++;
            fetchMedia();
        });

        // ========== FETCH MEDIA (XMLHttpRequest) ==========
        function updateSectionTitle() {
            if (isWatchlistView) return;
            var title = "";
            if (currentQuery) {
                title = 'Search results for "' + currentQuery + '"';
            } else {
                var catText = categoryFilter.options[categoryFilter.selectedIndex].text;
                var typeText = "Movies";
                if (currentType === "tv") typeText = "TV Series";
                if (currentType === "anime") typeText = "Anime";
                title = catText + " " + typeText;
                if (currentGenre && genreFilter.selectedIndex > 0) {
                    var genText = genreFilter.options[genreFilter.selectedIndex].text;
                    title = genText + " " + typeText + " - " + catText;
                }
            }
            sectionTitle.textContent = title;
        }

        function fetchMedia() {
            if (isWatchlistView) return;
            mediaGrid.innerHTML = "";
            mainLoader.classList.remove("hidden");
            pagination.classList.add("hidden");
            updateSectionTitle();

            var url = "";
            if (currentType === "anime") {
                var base = "https://kitsu.io/api/edge/anime?page[limit]=20&page[offset]=" + ((currentPage - 1) * 20);
                if (currentQuery) {
                    url = base + "&filter[text]=" + encodeURIComponent(currentQuery);
                } else {
                    if (currentGenre) base += "&filter[categories]=" + encodeURIComponent(currentGenre);
                    if (currentCategory === "trending") {
                        if (currentGenre) url = base + "&sort=-userCount";
                        else url = "https://kitsu.io/api/edge/trending/anime?page[limit]=20";
                    } else if (currentCategory === "popular") {
                        url = base + "&sort=-userCount";
                    } else {
                        url = base + "&sort=-averageRating";
                    }
                }
            } else {
                if (currentQuery) {
                    url = "https://api.themoviedb.org/3/search/" + currentType + "?api_key=" + TMDB_API_KEY + "&query=" + encodeURIComponent(currentQuery) + "&page=" + currentPage;
                } else {
                    var endpoint = "";
                    if (currentCategory === "trending") endpoint = "trending/" + currentType + "/week";
                    else if (currentCategory === "popular") endpoint = currentType + "/popular";
                    else endpoint = currentType + "/top_rated";
                    url = "https://api.themoviedb.org/3/" + endpoint + "?api_key=" + TMDB_API_KEY + "&page=" + currentPage;
                    if (currentGenre) url += "&with_genres=" + currentGenre;
                }
            }

            makeRequest(url, function(data) {
                var results = [];
                var totalPages = 1;
                if (currentType === "anime") {
                    results = data.data || [];
                    if (data.meta && data.meta.count) totalPages = Math.ceil(data.meta.count / 20);
                } else {
                    results = data.results || [];
                    totalPages = data.total_pages || 1;
                }
                mainLoader.classList.add("hidden");
                renderGrid(results, true);
                if (totalPages > 1 && !isWatchlistView) {
                    pagination.classList.remove("hidden");
                    pageIndicator.textContent = "Page " + currentPage + " of " + totalPages;
                    prevPageBtn.disabled = currentPage === 1;
                    nextPageBtn.disabled = currentPage >= totalPages;
                }
            }, function(error) {
                console.error("Fetch error", error);
                mainLoader.classList.add("hidden");
                mediaGrid.innerHTML = '<p class="col-span-full text-center text-red-500 py-10"><i class="ph-fill ph-warning-circle text-2xl mb-2"></i><br>Error loading media. Please try again.</p>';
            });
        }

        function formatMediaItem(rawItem) {
            var item = Object.assign({}, rawItem);
            item.originalType = currentType;
            if (rawItem.originalType) return rawItem;
            if (currentType === "anime") {
                item.id = rawItem.id;
                item.type = "anime";
                item.title = (rawItem.attributes && rawItem.attributes.titles && rawItem.attributes.titles.en) ||
                             (rawItem.attributes && rawItem.attributes.titles && rawItem.attributes.titles.en_jp) ||
                             (rawItem.attributes && rawItem.attributes.canonicalTitle) || "Unknown Anime";
                item.poster = (rawItem.attributes && rawItem.attributes.posterImage && rawItem.attributes.posterImage.large) || "";
                item.year = (rawItem.attributes && rawItem.attributes.startDate) ? rawItem.attributes.startDate.split("-")[0] : "N/A";
                item.rating = (rawItem.attributes && rawItem.attributes.averageRating) ? (parseFloat(rawItem.attributes.averageRating) / 10).toFixed(1) : "N/A";
            } else {
                item.id = rawItem.id;
                item.type = currentType;
                item.title = rawItem.title || rawItem.name;
                item.poster = rawItem.poster_path ? "https://image.tmdb.org/t/p/w500" + rawItem.poster_path : "";
                item.year = (rawItem.release_date || rawItem.first_air_date || "N/A").split("-")[0];
                item.rating = rawItem.vote_average ? rawItem.vote_average.toFixed(1) : "N/A";
            }
            return item;
        }

        function renderGrid(items, needsFormatting) {
            mediaGrid.innerHTML = "";
            if (!items || items.length === 0) {
                mediaGrid.innerHTML = '<p class="col-span-full text-center text-zinc-500 py-10">No results found.</p>';
                return;
            }
            for (var i = 0; i < items.length; i++) {
                var rawItem = items[i];
                var item = needsFormatting ? formatMediaItem(rawItem) : rawItem;
                if (!item.poster) continue;
                var isSaved = false;
                for (var w = 0; w < watchlist.length; w++) {
                    if (watchlist[w].id === item.id && watchlist[w].type === item.type) {
                        isSaved = true;
                        break;
                    }
                }
                var card = document.createElement("div");
                card.className = "group cursor-pointer flex flex-col gap-2 relative rounded-xl outline-none focus-visible:ring-4 focus-visible:ring-red-600 focus-visible:ring-offset-4 focus-visible:ring-offset-black transition-shadow";
                card.tabIndex = 0;
                card.addEventListener("keydown", function(it) {
                    return function(e) {
                        if (e.key === "Enter") openPlayer(it);
                    };
                }(item));
                card.onclick = function(it) {
                    return function() { openPlayer(it); };
                }(item);

                var html = '<div class="relative aspect-[2/3] overflow-hidden rounded-xl bg-zinc-900 border border-zinc-800 group-hover:border-red-600 group-focus-visible:border-red-600 transition-colors">';
                html += '<img src="' + item.poster + '" alt="' + item.title + '" loading="lazy" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105 group-focus-visible:scale-105">';
                html += '<div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100 transition-opacity flex flex-col items-center justify-center">';
                html += '<i class="ph-fill ph-play-circle text-5xl sm:text-6xl text-red-600 drop-shadow-[0_0_10px_rgba(220,38,38,0.8)] mb-2"></i>';
                html += '</div>';
                html += '<div class="absolute top-2 w-full px-2 flex justify-between items-start pointer-events-none">';
                html += '<div class="bg-black/80 backdrop-blur border border-zinc-800 text-white text-xs sm:text-sm font-bold px-2 py-1 rounded-md flex items-center gap-1">';
                html += '<i class="ph-fill ph-star text-red-500"></i> ' + item.rating + '</div>';
                html += '<button class="grid-bookmark bookmark-btn pointer-events-auto p-2 sm:p-2.5 bg-black/80 backdrop-blur border border-zinc-800 rounded-md text-zinc-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-red-600 ' + (isSaved ? "active" : "") + '" data-id="' + item.id + '" tabindex="0">';
                html += '<i class="ph ph-bookmark text-sm sm:text-base"></i></button></div>';
                if (item.type === "anime") {
                    html += '<div class="absolute bottom-2 left-2 bg-red-600 shadow-[0_0_8px_rgba(220,38,38,0.8)] text-white text-[10px] sm:text-xs font-bold px-1.5 py-0.5 rounded uppercase">Anime</div>';
                }
                html += '</div>';
                html += '<div class="px-1"><h3 class="font-semibold text-sm sm:text-base text-white line-clamp-1 group-hover:text-red-400 group-focus-visible:text-red-400 transition-colors">' + item.title + '</h3>';
                html += '<p class="text-xs sm:text-sm text-zinc-500">' + item.year + ' &bull; ' + (item.type === "movie" ? "Movie" : "TV Series") + '</p></div>';
                card.innerHTML = html;

                var btn = card.querySelector(".grid-bookmark");
                btn.onclick = function(it) {
                    return function(e) { toggleBookmark(it, e); };
                }(item);
                btn.addEventListener("keydown", function(it) {
                    return function(e) {
                        if (e.key === "Enter") {
                            e.stopPropagation();
                            toggleBookmark(it, e);
                        }
                    };
                }(item));
                mediaGrid.appendChild(card);
            }
        }

        function updateModalBookmarkBtn() {
            if (!currentMediaObj) return;
            var isSaved = false;
            for (var i = 0; i < watchlist.length; i++) {
                if (watchlist[i].id === currentMediaObj.id && watchlist[i].type === currentMediaObj.type) {
                    isSaved = true;
                    break;
                }
            }
            if (isSaved) modalBookmarkBtn.classList.add("active");
            else modalBookmarkBtn.classList.remove("active");
        }

        modalBookmarkBtn.onclick = function() {
            if (currentMediaObj) toggleBookmark(currentMediaObj);
        };

        // ========== ANIME TMDB RESOLVER ==========
        function getTmdbIdForAnime(animeTitle, callback) {
            var cleanTitle = animeTitle.split(":")[0].split("-")[0].trim();
            var url = "https://api.themoviedb.org/3/search/tv?api_key=" + TMDB_API_KEY + "&query=" + encodeURIComponent(cleanTitle);
            makeRequest(url, function(data) {
                if (data.results && data.results.length > 0) {
                    callback(data.results[0].id);
                } else {
                    callback(null);
                }
            }, function(e) {
                console.error("Anime resolve error", e);
                callback(null);
            });
        }

        // ========== PLAYER LOGIC ==========
        function openPlayer(item) {
            currentMediaObj = item;
            updateModalBookmarkBtn();
            modalTitle.textContent = item.title;
            playerModal.classList.remove("hidden");
            videoFrame.classList.add("hidden");
            playerLoader.classList.remove("hidden");
            tvSidebar.classList.add("hidden");
            streamStatus.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Connecting to stream...';
            streamStatus.className = "flex items-center gap-1.5 text-zinc-500 text-xs";
            currentMediaId = item.id;
            var actualType = item.type;

            if (item.type === "anime") {
                getTmdbIdForAnime(item.title, function(tmdbId) {
                    if (tmdbId) {
                        currentMediaId = tmdbId;
                        actualType = "tv";
                        proceedOpenPlayer(actualType);
                    } else {
                        streamStatus.innerHTML = '<i class="ph-fill ph-warning-circle text-red-500"></i> <span class="text-red-400">Stream not found for this anime</span>';
                        playerLoader.classList.add("hidden");
                    }
                });
            } else {
                proceedOpenPlayer(actualType);
            }
        }

        function proceedOpenPlayer(actualType) {
            if (actualType === "tv") {
                tvSidebar.classList.remove("hidden");
                tvSidebar.classList.add("flex");
                loadTvDetails(currentMediaId);
            } else {
                updateStreamIframe();
            }
            setTimeout(function() {
                if (clickShield && !clickShield.classList.contains("resolved")) {
                    clickShield.focus();
                } else if (closeModalBtn) {
                    closeModalBtn.focus();
                }
            }, 600);
        }

        closeModalBtn.addEventListener("click", function() {
            playerModal.classList.add("hidden");
            videoFrame.src = "";
            currentMediaObj = null;
            videoContainer.classList.remove("webview-fullscreen", "force-landscape");
            fullscreenBtn.innerHTML = '<i class="ph ph-corners-out text-base"></i> <span class="hidden sm:inline">Fullscreen</span>';
            setTimeout(function() {
                if (lastFocusedGridItem) {
                    lastFocusedGridItem.focus();
                    lastFocusedGridItem.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }, 150);
        });

        function loadTvDetails(id) {
            var url = "https://api.themoviedb.org/3/tv/" + id + "?api_key=" + TMDB_API_KEY;
            makeRequest(url, function(data) {
                seasonSelect.innerHTML = "";
                var seasons = [];
                for (var i = 0; i < data.seasons.length; i++) {
                    if (data.seasons[i].season_number > 0) seasons.push(data.seasons[i]);
                }
                for (var i = 0; i < seasons.length; i++) {
                    var opt = document.createElement("option");
                    opt.value = seasons[i].season_number;
                    opt.textContent = "Season " + seasons[i].season_number;
                    seasonSelect.appendChild(opt);
                }
                if (seasons.length > 0) {
                    currentSeason = seasons[0].season_number;
                    loadEpisodes(id, currentSeason);
                }
            }, function(e) {
                console.error("TV Details Error", e);
            });
        }

        function loadEpisodes(id, seasonNumber) {
            var url = "https://api.themoviedb.org/3/tv/" + id + "/season/" + seasonNumber + "?api_key=" + TMDB_API_KEY;
            makeRequest(url, function(data) {
                episodeList.innerHTML = "";
                for (var i = 0; i < data.episodes.length; i++) {
                    var ep = data.episodes[i];
                    var btn = document.createElement("button");
                    btn.className = "w-full text-left px-4 py-3 rounded-lg text-sm sm:text-base transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-white border border-transparent hover:border-zinc-800 focus:outline-none focus:ring-2 focus:ring-red-600";
                    btn.innerHTML = '<span class="font-mono text-zinc-500 mr-2">' + ep.episode_number + ".</span> " + ep.name;
                    if (ep.episode_number === 1) {
                        btn.classList.add("bg-red-600", "text-white", "border-red-500");
                        btn.classList.remove("text-zinc-400", "border-transparent", "hover:border-zinc-800", "hover:bg-zinc-900");
                    }
                    btn.onclick = function(epNum) {
                        return function() {
                            var allBtns = episodeList.querySelectorAll("button");
                            for (var j = 0; j < allBtns.length; j++) {
                                allBtns[j].classList.remove("bg-red-600", "text-white", "border-red-500");
                                allBtns[j].classList.add("text-zinc-400", "border-transparent", "hover:border-zinc-800", "hover:bg-zinc-900");
                            }
                            this.classList.add("bg-red-600", "text-white", "border-red-500");
                            this.classList.remove("text-zinc-400", "border-transparent", "hover:border-zinc-800", "hover:bg-zinc-900");
                            currentEpisode = epNum;
                            updateStreamIframe();
                        };
                    }(ep.episode_number);
                    episodeList.appendChild(btn);
                }
                currentEpisode = 1;
                updateStreamIframe();
            }, function(e) {
                console.error("Episode error", e);
            });
        }

        audioSubBtn.addEventListener("click", function() {
            currentAudioType = "sub";
            audioSubBtn.classList.add("bg-red-600", "text-white");
            audioSubBtn.classList.remove("text-zinc-400");
            audioDubBtn.classList.remove("bg-red-600", "text-white");
            audioDubBtn.classList.add("text-zinc-400");
            dubLangSelect.classList.add("hidden");
            updateStreamIframe();
        });

        audioDubBtn.addEventListener("click", function() {
            currentAudioType = "dub";
            audioDubBtn.classList.add("bg-red-600", "text-white");
            audioDubBtn.classList.remove("text-zinc-400");
            audioSubBtn.classList.remove("bg-red-600", "text-white");
            audioSubBtn.classList.add("text-zinc-400");
            dubLangSelect.classList.remove("hidden");
            updateStreamIframe();
        });

        dubLangSelect.addEventListener("change", function() {
            if (currentAudioType === "dub") updateStreamIframe();
        });

        serverSelect.addEventListener("change", updateStreamIframe);
        seasonSelect.addEventListener("change", function(e) {
            currentSeason = e.target.value;
            loadEpisodes(currentMediaId, currentSeason);
        });

        clickShield.addEventListener("click", function(e) {
            e.preventDefault();
            clickShield.classList.add("resolved");
            setTimeout(function() { videoFrame.focus(); }, 100);
        });

        adBlockToggle.addEventListener("click", function() {
            isAdShieldActive = !isAdShieldActive;
            if (isAdShieldActive) {
                adBlockToggle.className = "flex items-center gap-1.5 px-2.5 py-1.5 bg-green-900/30 text-green-500 border border-green-900 rounded-md text-xs font-semibold uppercase tracking-wider hover:bg-green-900/50 transition-colors";
                adBlockToggle.innerHTML = '<i class="ph-fill ph-shield-check text-base"></i> <span class="hidden sm:inline">Ad-Shield On</span>';
            } else {
                adBlockToggle.className = "flex items-center gap-1.5 px-2.5 py-1.5 bg-zinc-800 text-zinc-400 border border-zinc-700 rounded-md text-xs font-semibold uppercase tracking-wider hover:bg-zinc-700 transition-colors";
                adBlockToggle.innerHTML = '<i class="ph ph-shield text-base"></i> <span class="hidden sm:inline">Ad-Shield Off</span>';
            }
            updateStreamIframe();
        });

        fullscreenBtn.addEventListener("click", function() {
            var isCurrentlyFullscreen = videoContainer.classList.contains("webview-fullscreen") || document.fullscreenElement;
            if (!isCurrentlyFullscreen) {
                videoContainer.classList.add("webview-fullscreen", "force-landscape");
                fullscreenBtn.innerHTML = '<i class="ph ph-corners-in text-base"></i> <span class="hidden sm:inline">Exit</span>';
                try {
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen().catch(function(err) { console.warn(err); });
                    } else if (videoContainer.webkitRequestFullscreen) {
                        videoContainer.webkitRequestFullscreen();
                    }
                } catch (e) {}
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(function() {});
                }
            } else {
                videoContainer.classList.remove("webview-fullscreen", "force-landscape");
                fullscreenBtn.innerHTML = '<i class="ph ph-corners-out text-base"></i> <span class="hidden sm:inline">Fullscreen</span>';
                try {
                    if (document.fullscreenElement && document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                } catch (e) {}
                if (screen.orientation && screen.orientation.unlock) {
                    try { screen.orientation.unlock(); } catch (e) {}
                }
            }
        });

        floatingExitBtn.addEventListener("click", function() {
            exitFullscreen();
        });
        floatingExitBtn.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                exitFullscreen();
            }
        });

        document.addEventListener("fullscreenchange", function() {
            if (!document.fullscreenElement) {
                videoContainer.classList.remove("webview-fullscreen", "force-landscape");
                fullscreenBtn.innerHTML = '<i class="ph ph-corners-out text-base"></i> <span class="hidden sm:inline">Fullscreen</span>';
            }
        });

        function getStreamUrl() {
            var server = serverSelect.value;
            var lang = dubLangSelect.value;
            var isTv = currentMediaObj && (currentMediaObj.type === "tv" || currentMediaObj.type === "anime");
            var url = "";
            if (server === "vidsrc_to") {
                url = isTv ? "https://vidsrc.to/embed/tv/" + currentMediaId + "/" + currentSeason + "/" + currentEpisode : "https://vidsrc.to/embed/movie/" + currentMediaId;
            } else if (server === "vidsrc_me") {
                url = isTv ? "https://vidsrc.me/embed/tv?tmdb=" + currentMediaId + "&season=" + currentSeason + "&episode=" + currentEpisode : "https://vidsrc.me/embed/movie?tmdb=" + currentMediaId;
            } else if (server === "vidlink") {
                url = isTv ? "https://vidlink.pro/tv/" + currentMediaId + "/" + currentSeason + "/" + currentEpisode : "https://vidlink.pro/movie/" + currentMediaId;
            } else if (server === "smashy") {
                url = isTv ? "https://player.smashy.stream/tv/" + currentMediaId + "?s=" + currentSeason + "&e=" + currentEpisode : "https://player.smashy.stream/movie/" + currentMediaId;
            } else if (server === "multiembed") {
                url = isTv ? "https://multiembed.mov/?video_id=" + currentMediaId + "&tmdb=1&s=" + currentSeason + "&e=" + currentEpisode : "https://multiembed.mov/?video_id=" + currentMediaId + "&tmdb=1";
            } else if (server === "autoembed") {
                url = isTv ? "https://autoembed.co/tv/tmdb/" + currentMediaId + "-" + currentSeason + "-" + currentEpisode : "https://autoembed.co/movie/tmdb/" + currentMediaId;
            } else if (server === "2embed") {
                url = isTv ? "https://www.2embed.cc/embedtv/" + currentMediaId + "&s=" + currentSeason + "&e=" + currentEpisode : "https://www.2embed.cc/embed/" + currentMediaId;
            } else if (server === "vidbinge") {
                url = isTv ? "https://vidbinge.com/embed/tv/" + currentMediaId + "/" + currentSeason + "/" + currentEpisode : "https://vidbinge.com/embed/movie/" + currentMediaId;
            } else if (server === "movieapi") {
                url = isTv ? "https://moviesapi.club/tv/" + currentMediaId + "-" + currentSeason + "-" + currentEpisode : "https://moviesapi.club/movie/" + currentMediaId;
            }
            if (currentAudioType === "dub") {
                var prefix = url.indexOf("?") > -1 ? "&" : "?";
                url += prefix + "dub=1&audio=dub&lang=" + lang;
            }
            return url;
        }

        function updateStreamIframe() {
            if (!currentMediaId) return;
            videoFrame.classList.add("hidden");
            playerLoader.classList.remove("hidden");
            clickShield.classList.remove("resolved");
            if (isAdShieldActive) {
                videoFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-presentation");
            } else {
                videoFrame.removeAttribute("sandbox");
            }
            streamStatus.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Connecting to stream...';
            streamStatus.className = "flex items-center gap-1.5 text-zinc-500 text-xs";
            videoFrame.src = getStreamUrl();
            setTimeout(function() {
                playerLoader.classList.add("hidden");
                videoFrame.classList.remove("hidden");
                streamStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]"></span>Stream Connected <span class="text-zinc-500 text-[10px] ml-1 font-normal">(Use player gear icon for specific audio/subs)</span>';
                streamStatus.className = "flex items-center gap-1.5 text-green-400 font-medium text-xs";
            }, 1800);
        }

        // ========== TV NAVIGATION SYSTEM ==========
        function initTVNavigation() {
            if (tvNavInitialized) return;
            tvNavInitialized = true;
            document.addEventListener("keydown", handleTVKeyDown);
            mediaGrid.addEventListener("focusin", function(e) {
                var card = e.target.closest(".group");
                if (card) lastFocusedGridItem = card;
            });
            setTimeout(function() {
                var firstTab = document.querySelector('.tab-btn[data-type="movie"]');
                if (firstTab && !document.activeElement) firstTab.focus();
            }, 1000);
        }

        function handleTVKeyDown(e) {
            var direction = e.key;
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(direction) > -1) {
                var active = document.activeElement;
                if (active && active.tagName === "INPUT") {
                    var input = active;
                    var atStart = input.selectionStart === 0 && input.selectionEnd === 0;
                    var atEnd = input.selectionStart === input.value.length && input.selectionEnd === input.value.length;
                    if (direction === "ArrowLeft" && atStart) {
                        e.preventDefault();
                        navigateFocus(direction);
                    } else if (direction === "ArrowRight" && atEnd) {
                        e.preventDefault();
                        navigateFocus(direction);
                    } else if (direction === "ArrowDown" || direction === "ArrowUp") {
                        e.preventDefault();
                        navigateFocus(direction);
                    }
                    return;
                }
                if (active && active.tagName === "SELECT") {
                    if (direction === "ArrowLeft" || direction === "ArrowRight" || direction === "ArrowUp") {
                        e.preventDefault();
                        navigateFocus(direction);
                    }
                    return;
                }
                e.preventDefault();
                navigateFocus(direction);
                return;
            }
            if (e.key === "Escape" || e.key === "Backspace") {
                if (!playerModal.classList.contains("hidden")) {
                    e.preventDefault();
                    closeModalBtn.click();
                }
                return;
            }
            if (e.key === "Enter" && document.activeElement === clickShield) {
                e.preventDefault();
                clickShield.click();
                setTimeout(function() {
                    if (fullscreenBtn) fullscreenBtn.focus();
                }, 300);
            }
        }

        function getFocusables() {
            var selector = 'button, [href], input, select, textarea, iframe[tabindex], [tabindex]:not([tabindex="-1"])';
            var all = document.querySelectorAll(selector);
            var result = [];
            for (var i = 0; i < all.length; i++) {
                var el = all[i];
                if (el.disabled) continue;
                var style = window.getComputedStyle(el);
                if (style.display === "none" || style.visibility === "hidden") continue;
                if (el.closest(".hidden")) continue;
                if (playerLoader && !playerLoader.classList.contains("hidden") && playerLoader.contains(el)) continue;
                result.push(el);
            }
            return result;
        }

        function navigateFocus(direction) {
            var current = document.activeElement;
            if (!current) {
                var all = getFocusables();
                if (all.length) all[0].focus();
                return;
            }
            var currentRect = current.getBoundingClientRect();
            var cx = currentRect.left + currentRect.width / 2;
            var cy = currentRect.top + currentRect.height / 2;
            var focusables = getFocusables();
            var best = null;
            var bestScore = Infinity;
            for (var i = 0; i < focusables.length; i++) {
                var el = focusables[i];
                if (el === current) continue;
                var rect = el.getBoundingClientRect();
                var ex = rect.left + rect.width / 2;
                var ey = rect.top + rect.height / 2;
                var isInDirection = false;
                var primaryDist = Infinity;
                var secondaryDist = Infinity;
                var tolerance = 20;
                if (direction === "ArrowRight") {
                    if (rect.left >= currentRect.right - tolerance) {
                        isInDirection = true;
                        primaryDist = rect.left - currentRect.right;
                        secondaryDist = Math.abs(ey - cy);
                    }
                } else if (direction === "ArrowLeft") {
                    if (rect.right <= currentRect.left + tolerance) {
                        isInDirection = true;
                        primaryDist = currentRect.left - rect.right;
                        secondaryDist = Math.abs(ey - cy);
                    }
                } else if (direction === "ArrowDown") {
                    if (rect.top >= currentRect.bottom - tolerance) {
                        isInDirection = true;
                        primaryDist = rect.top - currentRect.bottom;
                        secondaryDist = Math.abs(ex - cx);
                    }
                } else if (direction === "ArrowUp") {
                    if (rect.bottom <= currentRect.top + tolerance) {
                        isInDirection = true;
                        primaryDist = currentRect.top - rect.bottom;
                        secondaryDist = Math.abs(ex - cx);
                    }
                }
                if (!isInDirection) continue;
                var score = primaryDist * 3 + secondaryDist;
                if (score < bestScore) {
                    bestScore = score;
                    best = el;
                }
            }
            if (best) {
                best.focus();
                best.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
            }
        }
    </script>
